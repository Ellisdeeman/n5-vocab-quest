# Review reminders (Web Push) for JLPT Vocab Quest — see push/run.js. Public repo → Actions minutes are free.
# Every 10 min (GitHub may start scheduled runs late or skip some under load). Per-device state lives on the push-state
# branch (hashed keys + timestamps only); it is committed only when something changed. Pages builds from main only.
name: Review reminders
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_sub:
        description: "Optional: PushSubscription JSON — send one test push to it instead of the normal run"
        required: false
        default: ""
permissions:
  contents: write   # push-state branch
  actions: write    # keep this scheduled workflow enabled (GitHub disables crons after 60 days without repo activity)
concurrency:
  group: review-reminders
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: push
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix push --omit=dev --no-audit --no-fund
      - name: Load state
        run: |
          git fetch --depth=1 origin push-state 2>/dev/null && git show FETCH_HEAD:state.json > state.json || echo '{"v":1,"dev":{}}' > state.json
          git show FETCH_HEAD:duo.json > duo.json 2>/dev/null || echo '{"v":1,"s":{}}' > duo.json
      - name: Decide and send
        id: run
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_DATA_KEY: ${{ secrets.PUSH_DATA_KEY }}
          TEST_SUB: ${{ github.event.inputs.test_sub }}
        run: node push/run.js state.json duo.json
      - name: Save state
        if: steps.run.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node push/save.js state.json "reminder state"
      - name: Save Duolingo status
        # non-fatal: reminders were already sent; a failed save only leaves the app's Duolingo status a run behind
        if: steps.run.outputs.duo_changed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node push/save.js duo.json "duolingo status"
      - name: Keep the schedule enabled
        # runs even when an earlier step failed, so a bad save can never let GitHub disable the cron
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M)" \< "0010" ]; then gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/push.yml/enable" --silent || true; fi
