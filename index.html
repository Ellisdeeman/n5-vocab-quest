<style>
/* ---------- design tokens: "Stats Trainer" style (dark default look, suggested light mapping); theme setting = auto | light | dark ---------- */
:root{
  --tint:var(--accent);--r:16px;--rs:14px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --bg:#f6f7f9;--bg2:#ffffff;--card:#ffffff;--card2:#f0f2f5;--border:#dde2e8;--track:#e3e7ec;--fill:rgba(91,101,116,.1);--fill2:rgba(91,101,116,.2);
  --label:#111418;--label2:#5b6574;--label3:rgba(91,101,116,.6);--sep:#dde2e8;
  --accent:#0f766e;--accent-ink:#ffffff;--accentT:rgba(15,118,110,.12);
  --good:#15803d;--goodT:rgba(22,163,74,.12);--bad:#dc2626;--badT:rgba(220,38,38,.1);--idk:#a16207;
  --orange:#c2410c;--yellow:#a16207;--purple:#9333ea;--pink:#db2777;--teal:#0d9488;--indigo:#4f46e5;--mint:#0e7490;--cyan:#0369a1;--blue:#2563eb;--lime:#4d7c0f;--rose:#e11d48;--gray:#64748b;
  --kana:#86198f;--n5:#1d4ed8;--n4:#6d28d9;--n3:#be185d;--n2:#92400e;--n1:#9a3412;
  --ring1:#e11d48;--ring2:#65a30d;--ring3:#0284c7;
  --s1:#ea580c;--s2:#d97706;--s3:#65a30d;--s4:#14b8a6;--s5:#0f766e;
  --pillmix:#000;--navbg:rgba(246,247,249,.92);--shadow:none;--mark:#fde68a;--toastbg:rgba(17,20,24,.92);color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1116;--bg2:#171b22;--card:#171b22;--card2:#1d222b;--border:#2a313c;--track:#262c36;--fill:rgba(154,164,178,.12);--fill2:rgba(154,164,178,.22);
  --label:#e8ecf1;--label2:#9aa4b2;--label3:rgba(154,164,178,.6);--sep:#2a313c;
  --accent:#2dd4bf;--accent-ink:#04201c;--accentT:rgba(45,212,191,.14);
  --good:#22c55e;--goodT:rgba(34,197,94,.14);--bad:#ef4444;--badT:rgba(239,68,68,.14);--idk:#fbbf24;
  --orange:#fb923c;--yellow:#fbbf24;--purple:#c084fc;--pink:#f472b6;--teal:#5eead4;--indigo:#818cf8;--mint:#67e8f9;--cyan:#38bdf8;--blue:#60a5fa;--lime:#a3e635;--rose:#fb7185;--gray:#94a3b8;
  --kana:#e879f9;--n5:#60a5fa;--n4:#a78bfa;--n3:#f472b6;--n2:#fbbf24;--n1:#fb923c;
  --ring1:#fb7185;--ring2:#a3e635;--ring3:#38bdf8;
  --s1:#fb923c;--s2:#fbbf24;--s3:#a3e635;--s4:#5eead4;--s5:#2dd4bf;
  --pillmix:#fff;--navbg:rgba(14,17,22,.92);--shadow:none;--mark:rgba(251,191,36,.3);--toastbg:rgba(29,34,43,.96);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0e1116;--bg2:#171b22;--card:#171b22;--card2:#1d222b;--border:#2a313c;--track:#262c36;--fill:rgba(154,164,178,.12);--fill2:rgba(154,164,178,.22);
  --label:#e8ecf1;--label2:#9aa4b2;--label3:rgba(154,164,178,.6);--sep:#2a313c;
  --accent:#2dd4bf;--accent-ink:#04201c;--accentT:rgba(45,212,191,.14);
  --good:#22c55e;--goodT:rgba(34,197,94,.14);--bad:#ef4444;--badT:rgba(239,68,68,.14);--idk:#fbbf24;
  --orange:#fb923c;--yellow:#fbbf24;--purple:#c084fc;--pink:#f472b6;--teal:#5eead4;--indigo:#818cf8;--mint:#67e8f9;--cyan:#38bdf8;--blue:#60a5fa;--lime:#a3e635;--rose:#fb7185;--gray:#94a3b8;
  --kana:#e879f9;--n5:#60a5fa;--n4:#a78bfa;--n3:#f472b6;--n2:#fbbf24;--n1:#fb923c;
  --ring1:#fb7185;--ring2:#a3e635;--ring3:#38bdf8;
  --s1:#fb923c;--s2:#fbbf24;--s3:#a3e635;--s4:#5eead4;--s5:#2dd4bf;
  --pillmix:#fff;--navbg:rgba(14,17,22,.92);--shadow:none;--mark:rgba(251,191,36,.3);--toastbg:rgba(29,34,43,.96);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Hiragino Sans","Noto Sans JP",system-ui,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",-apple-system,sans-serif;font-feature-settings:"palt" 0}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none;touch-action:manipulation}
a{color:var(--accent)}
.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
/* ---------- navigation bar ---------- */
.navbar{position:sticky;top:0;z-index:30;background:var(--navbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding-top:var(--safe-t)}
.navin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px calc(14px + var(--safe-r)) 6px calc(14px + var(--safe-l));min-height:52px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.06rem;letter-spacing:-.01em;min-height:44px;padding:0 4px 0 0}
.logo .appic{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.logo b{color:var(--tint)}
.stats{display:flex;gap:6px;margin-left:auto;align-items:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:600;white-space:nowrap;color:var(--label)}
.pill .i{width:15px;height:15px}.pill .e-flame{color:var(--orange)}.pill .e-star{color:var(--yellow)}.pill .e-timer{color:var(--pink)}.pill .e-trophy{color:var(--good)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-size:1.2rem;flex:none}
.iconbtn:active{background:var(--fill)}
.xpline{height:2px;background:transparent;overflow:hidden}.xpline>div{height:100%;background:var(--tint);transition:width .5s cubic-bezier(.2,.8,.2,1)}
@media (max-width:520px){.pill.hide-sm{display:none}.logo span.lt{display:none}}
@media (max-width:370px){.pill{padding:4px 7px}.stats{gap:3px}}
/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;justify-content:center;padding:0 var(--safe-r) var(--safe-b) var(--safe-l);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tabbar>div{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;padding:6px 0 4px;color:var(--label2);font-size:.66rem;font-weight:500;position:relative}
.tabbar button .i{width:25px;height:25px}
.tabbar button.on{color:var(--accent)}
.tabbar button:active .i{transform:scale(.88)}
.tbi{position:relative;display:inline-flex}
.hbadge{position:absolute;top:-4px;left:15px;background:var(--bad);color:#fff;border-radius:999px;font-size:.66rem;font-weight:700;padding:1px 5px;min-width:18px;line-height:1.35;text-align:center}
body.studying .tabbar{transform:translateY(110%)}
/* ---------- layout ---------- */
#app{max-width:760px;margin:0 auto;padding:12px calc(16px + var(--safe-r)) calc(96px + var(--safe-b)) calc(16px + var(--safe-l))}
body.studying #app{padding-bottom:calc(32px + var(--safe-b))}
#view{animation:viewin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.largetitle{font-size:2.05rem;font-weight:800;letter-spacing:-.02em;margin:6px 2px 2px}
.subtitle{color:var(--label2);font-size:.95rem;margin:0 2px 14px}
h2{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.sechead{font-size:.8rem;text-transform:uppercase;letter-spacing:.02em;color:var(--label2);margin:22px 16px 6px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--card);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--shadow);min-height:44px;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.mode:active{transform:scale(.97)}
.mode .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--c,var(--accent));color:#fff;font-size:20px}
.mode .ic .i{width:21px;height:21px}
.mode h3{margin:2px 0 0;font-size:1rem;font-weight:600;display:flex;align-items:center;gap:6px}
.mode p{margin:0;color:var(--label2);font-size:.82rem}
.mode.disabled{opacity:.45;cursor:not-allowed}
.mode .badge,.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px;font-size:.72rem;font-weight:700}
[data-m=meaning] .ic,[data-km=k2r] .ic{--c:var(--accent)}[data-m=reverse] .ic,[data-km=r2k] .ic{--c:var(--indigo)}[data-m=reading] .ic,[data-km=read] .ic{--c:var(--orange)}[data-m=typing] .ic,[data-km=type] .ic{--c:#8e8e93}
[data-m=listen] .ic,[data-km=listen] .ic{--c:var(--pink)}[data-m=speed] .ic,[data-km=speed] .ic{--c:var(--yellow)}[data-m=match] .ic,[data-km=match] .ic{--c:var(--teal)}[data-m=sets] .ic{--c:var(--purple)}
[data-m=leeches] .ic{--c:var(--bad)}[data-m=browse] .ic,[data-km=chart] .ic{--c:var(--cyan)}[data-m=kana] .ic{--c:var(--mint)}[data-m=due] .ic{--c:var(--orange)}[data-m=mixed] .ic{--c:var(--good)}
.panel{background:var(--card);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 10px;font-size:1.12rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.muted{color:var(--label2)}
.hidden{display:none!important}
/* ---------- hero (today's session) ---------- */
.hero{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);flex-wrap:wrap;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--tint)}
.hero .ic{width:48px;height:48px;border-radius:14px;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.hero .ic .i{width:28px;height:28px}
.hero.done .ic{background:var(--good)}.hero.done::before{background:var(--good)}
.hero>div:nth-child(2){flex:1;min-width:190px}
.hero h2{margin:0;font-size:1.15rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero p{margin:3px 0 0;color:var(--label2);font-size:.88rem}
.hero .btn{margin-left:auto}
.dots{display:flex;gap:6px;margin-top:8px}.dots span{width:24px;height:24px;border-radius:50%;background:var(--fill);font-size:.62rem;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--label2)}
.dots span.on{background:var(--good);color:#fff}
/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;font-size:1rem;min-height:44px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.sec{background:var(--accentT);color:var(--accent)}
.btn.ghost{background:var(--fill);color:var(--label)}
.btn.small{padding:8px 14px;font-size:.9rem;min-height:40px}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin:4px 0}
.seg button{flex:1;border-radius:8px;padding:7px 8px;font-weight:600;font-size:.86rem;min-height:36px;color:var(--label);transition:background .2s}
.seg button.on{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme=dark] .seg button.on{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button.on{background:#636366}}
.switch{position:relative;width:51px;height:31px;background:var(--fill2);border-radius:31px;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:left .3s cubic-bezier(.3,1.4,.5,1)}
.switch.on{background:var(--good)}.switch.on::after{left:22px}
input[type=number]{width:76px;padding:8px;border-radius:10px;border:none;background:var(--fill);color:var(--label);font:inherit;text-align:center;min-height:40px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:.5px solid var(--sep);min-height:44px}
.row:last-child{border-bottom:none}
.row small{font-size:.8rem}
/* ---------- sub-screen top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap;min-height:44px}
.topbar>b{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:6px}
.backbtn{display:inline-flex;align-items:center;gap:0;color:var(--accent);font-size:1.02rem;min-height:44px;padding:0 8px 0 0;margin-left:-6px}
.backbtn .i{width:26px;height:26px}
.combo{font-weight:700;color:var(--orange);display:inline-flex;align-items:center;gap:3px;font-size:.9rem}
.combo.bump{animation:pop .3s}
/* ---------- quiz card ---------- */
.card{background:var(--card);color:var(--label);border-radius:22px;padding:22px 18px;text-align:center;box-shadow:var(--shadow);position:relative}
.qtype{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--label2);font-weight:600}
.prompt{font-size:clamp(2.8rem,12vw,4.6rem);line-height:1.15;margin:12px 0 4px;word-break:break-word;font-weight:500;letter-spacing:.01em}
.prompt.en{font-size:clamp(1.35rem,5.4vw,1.9rem);font-weight:700;letter-spacing:-.01em}
.sub{color:var(--label2);min-height:1.4em;font-size:1.1rem}
.sub.jp{font-size:1.45rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media(max-width:480px){.choices{grid-template-columns:1fr}}
.choice{background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:14px 18px;color:var(--label);font-size:1.03rem;min-height:56px;transition:transform .12s,background .2s,border-color .2s;position:relative}
.choice .k{position:absolute;left:10px;top:7px;font-size:.66rem;color:var(--label3);font-weight:600}
.choice.jpc{font-size:1.55rem}
.choice.jpc small{display:block;font-size:.82rem;color:var(--label2)}
@media (hover:hover){.choice:not(:disabled):hover{border-color:var(--accent)}}
.choice:active{transform:scale(.97)}
.choice.right{background:var(--good);color:#fff;border-color:var(--good);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.choice.right small{color:#fffc}
.choice.wrong{background:var(--bad);color:#fff;border-color:var(--bad);animation:shake .3s}
.choice.wrong small{color:#fffc}
.choice:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card .iconbtn{position:absolute;right:10px;top:10px;background:var(--accentT)}
.feedback{min-height:1.4em;margin-top:14px;font-weight:500}
.feedback>div:first-child{font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.idkrow{margin-top:10px}.idk kbd{font-size:.68rem;opacity:.6}
.idknote{margin-top:4px}
.bigspk{width:112px;height:112px;border-radius:50%;background:var(--accent);color:#fff;margin:12px auto;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 10px 26px var(--accentT);transition:transform .15s}
.bigspk .i{width:50px;height:50px}
.bigspk:active{transform:scale(.94)}
.typein{width:100%;font-size:1.7rem;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--sep);margin-top:14px;font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;color:var(--label);background:var(--card2);min-height:56px}
.typein:focus{outline:none;border-color:var(--accent)}
.typein.ok{border-color:var(--good)}.typein.no{border-color:var(--bad);animation:shake .3s}
.typehelp{font-size:.78rem;color:var(--label2);margin-top:6px}
.ex{margin-top:12px;background:var(--card2);border-radius:14px;padding:11px 13px;text-align:left;color:var(--label)}
.ex .jps{font-size:1.2rem;line-height:1.55}.ex .ens{color:var(--label2);font-size:.9rem}
.ex mark{background:var(--mark);border-radius:4px;padding:0 2px;color:inherit}
.ex .mini{color:var(--accent);min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;border-radius:50%}
.ex .mini:active{background:var(--fill)}
.ex a{color:var(--label2);font-size:.7rem;display:inline-flex;align-items:center;gap:3px}
.note{margin-top:10px;background:rgba(255,204,0,.16);border-radius:12px;padding:9px 12px;text-align:left;font-size:.93rem;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.note .e-bulb{color:var(--orange)}
.notebox{width:100%;min-height:58px;border-radius:12px;border:none;background:var(--card2);color:var(--label);padding:10px;font:inherit;font-size:.95rem;resize:vertical}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--fill);color:var(--label2);border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:600;margin:2px}
.big{font-size:2.5rem;font-weight:800;color:var(--tint);display:flex;justify-content:center}
.big .i{width:56px;height:56px}
kbd{background:var(--fill);border-radius:5px;padding:1px 5px;font-size:.78em;font-family:inherit}
.sprog,.timebar{height:6px;background:var(--fill);border-radius:6px;overflow:hidden;margin-bottom:12px}.sprog>div{height:100%;background:var(--good);transition:width .35s cubic-bezier(.2,.8,.2,1);border-radius:6px}
.timebar{flex:1;min-width:120px;margin:0}.timebar>div{height:100%;background:var(--orange);transition:width .2s linear}
.timer{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);color:var(--label);border-radius:14px;padding:12px 8px;min-height:68px;font-size:1rem;border:2px solid transparent;transition:all .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
.tile.jpt{font-size:1.5rem}.tile.jpt div{color:var(--label2)!important}
.tile.sel{border-color:var(--accent);transform:scale(1.03)}
.tile.done{opacity:0;transform:scale(.7);pointer-events:none}
.tile.bad{animation:shake .3s;border-color:var(--bad)}
/* ---------- progress ---------- */

/* ================= "Stats Trainer" style layer =================
   Near-black / light neutrals, 1px bordered cards (radius 16), 2px bordered list rows (radius 14), one teal accent for
   primary actions, progress and selection; green/red only for right/wrong; tinted 14% pills; 18px base; 54px tap targets. */
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:18px;line-height:1.5}
.card,.mode,.panel,.hero,.group,.stathead .st,.kjcard,.kjtile,#setlist,#krows,.leechrow,.tile,.kcell:not(.empty),.lvcard,.settingspage .box{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:none}

.hero::before{width:3px;background:var(--accent)}
.hero .ic,.hero.done .ic{background:var(--accentT);color:var(--accent)}
.hero.done::before{background:var(--accent)}
.hero p,.mode p,.subtitle{font-size:15px;line-height:1.4}
.largetitle{font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.2}

h2,.panel h2{font-size:20px}.hero h2{font-size:20px}
.sechead{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:22px 4px 8px}
.muted,.legend,.lvhelp,.typehelp{color:var(--label2)}
/* nav + tab bar */
.navbar{background:var(--navbg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.logo .appic{width:36px;height:36px;border-radius:10px;box-shadow:none}
.logo b{color:var(--accent)}
.pill{background:var(--card2);border:1px solid var(--border);color:var(--label)}
.iconbtn{color:var(--accent)}
.xpline>div{background:var(--accent)}
.tabbar{background:var(--navbg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--border)}
.tabbar button{min-height:54px;color:var(--label2);font-size:12px;font-weight:600}
.tabbar button.on{color:var(--accent)}
.hbadge,.mode .badge,.badge{background:var(--accent);color:var(--accent-ink)}
#app{padding-bottom:calc(104px + var(--safe-b))}

.btn{background:var(--accent);color:var(--accent-ink);border-radius:14px;min-height:54px;padding:12px 20px;font-size:17px;font-weight:600;border:none}

.backbtn{color:var(--accent);min-height:44px}
/* mode tiles / categories: tinted icon chips instead of solid squares */
.mode{padding:16px;min-height:54px}
.mode .ic,.setcard .ic,.duerow .ic{background:var(--card2);background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent))}
.mode h3{font-size:17px}
[data-m=meaning] .ic,[data-km=k2r] .ic{--c:var(--blue)}[data-m=match] .ic,[data-km=match] .ic{--c:var(--lime)}[data-m=typing] .ic,[data-km=type] .ic{--c:var(--gray)}
[data-m=mixed] .ic{--c:var(--lime)}[data-m=leeches] .ic{--c:var(--rose)}[data-m=kana] .ic{--c:var(--kana)}
.setcard.locked .ic{--c:var(--gray)}
/* tag pills: colour at 14% + light (dark mode) / deep (light mode) text */
.lvtag,.tag,.newtag{--c:var(--accent);display:inline-block;background:var(--card2);background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 62%,var(--pillmix));border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;border:0}
.tag{--c:var(--gray)}
.pathsteps span.cur{background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 62%,var(--pillmix));box-shadow:inset 0 0 0 1.5px var(--c)}
/* segmented controls + switch */
.seg{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:3px}
.seg button{border-radius:11px;min-height:40px;color:var(--label2)}
.seg button.on,:root[data-theme=dark] .seg button.on{background:var(--accentT);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button.on{background:var(--accentT)}}
.switch{width:52px;height:32px;background:var(--fill2);border-radius:32px}
:root:not([data-theme=light]) .switch:not(.on){background:#39414d}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .switch:not(.on){background:#c9d0d9}}
:root[data-theme=light] .switch:not(.on){background:#c9d0d9}
.switch::after{width:26px;height:26px;left:3px;top:3px}
.switch.on{background:var(--accent)}.switch.on::after{left:23px}
input[type=number],.alrow input[type=url],.notebox{background:var(--card2);border:1px solid var(--border);border-radius:14px;color:var(--label)}
.row{border-bottom:1px solid var(--border);min-height:52px}
/* quiz: list-row choices */
.choice{background:var(--card2);border:2px solid var(--border);border-radius:14px;min-height:58px;font-size:18px}
@media (hover:hover){.choice:not(:disabled):hover{border-color:var(--accent)}}
.choice:active{transform:scale(.99)}
.choice.right{background:var(--goodT);color:var(--label);border-color:var(--good)}
.choice.wrong{background:var(--badT);color:var(--label);border-color:var(--bad)}
.choice.right small,.choice.wrong small{color:var(--label2)}
.choice.right::after,.choice.wrong::after{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.choice.right::after{content:"✓";background:var(--good)}.choice.wrong::after{content:"✕";background:var(--bad)}
.choices:has(.choice.right) .choice:not(.right):not(.wrong){opacity:.6}
.card .iconbtn{background:var(--accentT)}
.bigspk{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.typein{background:var(--card2);border:2px solid var(--border);border-radius:14px}
.typein:focus{border-color:var(--accent)}
.ex,.kjex{background:var(--card2);border:1px solid var(--border);border-radius:14px}
.note{background:rgba(251,191,36,.08);border-left:3px solid var(--yellow);border-radius:6px}
.qtype{font-size:14px;letter-spacing:.04em;color:var(--label2);font-weight:700}
.feedback{font-size:17px}
/* progress */
.sprog,.timebar,.minibar{background:var(--track);border-radius:999px}
.sprog{height:8px}.sprog>div{background:var(--accent);border-radius:999px;transition:width .25s}
.timebar>div{background:var(--accent)}
.minibar{height:8px}.minibar i{border-radius:999px}
.dots span{background:var(--card2);border:1px solid var(--border)}.dots span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#map .b0,.legend .b0{background:var(--fill2)}#map .b1,.legend .b1{background:var(--s1)}#map .b2,.legend .b2{background:var(--s2)}#map .b3,.legend .b3{background:var(--s3)}#map .b4,.legend .b4{background:var(--s4)}#map .b5,.legend .b5{background:var(--s5)}
.kb1{border-bottom-color:var(--s1)}.kb2{border-bottom-color:var(--s2)}.kb3{border-bottom-color:var(--s3)}.kb4{border-bottom-color:var(--s4)}.kb5{border-bottom-color:var(--s5)}
.kjtile.b1,.kjtile.b0{box-shadow:inset 0 -3px 0 var(--s1)}.kjtile.b2,.kjtile.b3{box-shadow:inset 0 -3px 0 var(--s3)}.kjtile.b4,.kjtile.b5{box-shadow:inset 0 -3px 0 var(--s5)}
.kjtile{border-radius:14px}
.chart .bar i{background:color-mix(in srgb,var(--accent) 45%,transparent)}.chart .bar.met i{background:var(--accent)}
.chart .goalline{border-top-color:var(--ring1)}.chart .goalline span{color:var(--ring1)}
.goalpanel.met{box-shadow:none;border-color:var(--accent)}
.duen{color:var(--accent)}
.combo,.floatxp{color:var(--yellow)}
/* lists: 2px bordered rows, selected = accent border */
#setlist,#krows{padding:6px;display:flex;flex-direction:column;gap:6px}
.setcard,.duerow{background:var(--card2);border:2px solid var(--border);border-radius:14px;min-height:58px}
.setcard:last-child,.duerow:last-child{border-bottom:2px solid var(--border)}
.duepanel{padding:0 8px 8px}.duepanel h2{padding:14px 6px 6px}.duepanel .duerow{margin-top:6px}
details.duesets{border-bottom:0}details.duesets summary{color:var(--accent);padding-left:14px}details.duesets .duerow{padding-left:14px;margin-left:14px;width:calc(100% - 14px)}
.lvcard{border:2px solid var(--border);border-radius:14px}
.lvcard.on{border-color:var(--accent)}
.lvcard .minibar i:last-child{background:var(--lc)!important}
.lvlist{display:flex;flex-direction:column;gap:6px}
.lvlist .lvcard{border:2px solid var(--border);border-radius:14px;background:var(--card2)}
.lvlist .lvcard:last-child{border-bottom:2px solid var(--border)}
.lvlist .lvcard.on{border-color:var(--accent);background:var(--card2)}
.lvlist .lvcard .lvbadge{background:color-mix(in srgb,var(--lc) 14%,transparent);color:color-mix(in srgb,var(--lc) 62%,var(--pillmix))}
.lvchk{color:var(--accent)}
.lvhead{background:transparent;color:var(--accent);font-size:14px;font-weight:700;letter-spacing:.04em}
.pathbar{background:var(--card2);border:1px solid var(--border)}
/* kanji */
.kjsvgwrap{background:var(--card2);border:1px solid var(--border)}
.kjsvg .kjst.cur{stroke:var(--accent)}
.kjexrow{border-bottom:1px solid var(--border)}.kjexrow svg{color:var(--accent)}
.kjcard svg:last-child{color:var(--label2)}
/* sheets & toasts */
.modal{background:rgba(0,0,0,.5)}
.modal .box{background:var(--card);border:1px solid var(--border)}
.toast{background:var(--toastbg);color:#e8ecf1;border:1px solid rgba(255,255,255,.08)}
.updbar{background:var(--card);border:1px solid var(--border)}
/* audio lesson card keeps its own identity only in the icon chip */
.alcard:not(.done){--tint:var(--accent)}
.alcard .ic{--c:var(--indigo);background:color-mix(in srgb,var(--indigo) 14%,transparent)!important;color:var(--indigo)!important}
.alcard .minibar i{background:var(--accent)!important}
/* small phones with the 18px type */
@media (max-width:380px){html,body{font-size:17px}.btn{padding:12px 16px}.hero{padding:16px}.card{padding:18px 14px}.grid{gap:10px}.mode{padding:14px}}
@media (max-width:340px){.grid{grid-template-columns:1fr 1fr}.mode{padding:12px}.mode h3{font-size:16px}}
.duerow{flex-wrap:wrap;row-gap:8px}.duerow .grow{min-width:150px}.duerow .btn{margin-left:auto}
/* contrast + tap-target fixes (WCAG AA checked in dark and light) */
.choice .k{color:var(--label2)}
.okuri{color:var(--label2);text-decoration:underline dotted;text-underline-offset:3px}
.seg button.on,:root[data-theme=dark] .seg button.on{background:var(--card);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button.on{background:var(--card)}}
.mode .ic,.setcard .ic,.duerow .ic{color:var(--c,var(--accent));color:color-mix(in srgb,var(--c,var(--accent)) 72%,var(--pillmix))}
.duerow .ic b,.lvring b{color:var(--lc,inherit)}
.duerow .ic.lvic b{color:inherit}
.switch{overflow:visible}.switch::before{content:"";position:absolute;inset:-7px -4px}
.goalpanel .progress-big>div{min-width:0}.goalrow span{flex-wrap:wrap;min-width:0}
@media (max-width:380px){.goalrings{width:96px;height:96px}.goalpanel .progress-big{gap:12px}}
/* ================= Mini games ================= */
.ggrid .gtile{min-height:54px}
.ghost{max-width:720px;margin:0 auto}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 10px;font-weight:700;font-size:15px;flex-wrap:wrap}
.gbar b{font-variant-numeric:tabular-nums}
.gmult{background:color-mix(in srgb,var(--accent) var(--pillmix,14%),transparent);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:800}
.ghearts{letter-spacing:2px;font-size:22px;white-space:nowrap;line-height:1}.ghearts .gh{font-style:normal;color:var(--label2)}.ghearts .gh.on{color:var(--rose)}
.arena{position:relative;height:min(52vh,430px);min-height:300px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;background:var(--card2);border:1px solid var(--border);border-radius:16px;contain:strict;-webkit-tap-highlight-color:transparent}
.gtarget{position:absolute;left:0;top:0;min-height:58px;min-width:96px;max-width:72%;padding:8px 14px;border:2px solid var(--border);border-radius:14px;background:var(--card);color:var(--label);font:inherit;font-size:16px;font-weight:700;line-height:1.25;text-align:center;will-change:transform;touch-action:none;cursor:pointer;white-space:normal;overflow-wrap:anywhere}
.gtarget.jp{font-size:19px}
.gtarget.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.gtarget.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.gmsg{min-height:1.6em;text-align:center;font-weight:700;margin:8px 0;font-size:15px}
.gpause{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--bg) 80%,transparent);z-index:5}
.gpause .btn{margin-top:10px}
.kbwrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0}
.kbcanvas{width:160px;height:160px;border:2px dashed var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--card2)}
.kbsvg{width:100%;height:100%}.kbsvg.big{width:150px;height:150px}
.kbsvg path{fill:none;stroke:var(--label);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.kbsvg path.p0{stroke:var(--accent)}.kbsvg path.p1{stroke:var(--n4)}.kbsvg path.p2{stroke:var(--n2)}.kbsvg path.p3{stroke:var(--n3)}
.kbslots{display:flex;gap:8px}.kbslots i{width:28px;height:6px;border-radius:3px;background:var(--track,var(--fill))}.kbslots i.on{background:var(--accent)}
.kbtray{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin:10px 0}
.kbtile{min-height:72px;aspect-ratio:1;border:2px solid var(--border);border-radius:14px;background:var(--card);color:var(--label);padding:8px;display:flex;align-items:center;justify-content:center;font:inherit;font-size:28px;cursor:pointer;touch-action:manipulation}
.kbtile .kbsvg path{stroke-width:6}
.kbtile.used{opacity:.3;border-color:var(--accent)}
.kbtile.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.kbtext{font-size:28px;text-align:center}
.kbsolved{margin-top:10px}
.scen{font-size:17px;margin:4px 0 10px}
.sans{min-height:70px;border:2px dashed var(--border);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.sans.ok{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.sans.shown{border-style:solid;border-color:var(--idk)}
.sans.shake{animation:gshake .35s}
@keyframes gshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:60px}
.stile{min-height:54px;min-width:54px;padding:6px 14px;border:2px solid var(--border);border-radius:14px;background:var(--card);color:var(--label);font:inherit;font-size:20px;cursor:pointer;touch-action:manipulation}
.stile.placed{border-color:var(--accent);background:color-mix(in srgb,var(--accent) var(--pillmix,14%),var(--card))}
.spunct{font-size:20px;color:var(--label2)}
.shint{font-size:14px}
.bosshead{display:flex;align-items:center;gap:14px;padding:14px 16px}
.bossic{font-size:48px;line-height:1}
.bossic.hit{animation:gshake .35s}
.hpbar{height:14px;border-radius:7px;background:var(--track,var(--fill));overflow:hidden;margin:6px 0 2px}
.hpbar i{display:block;height:100%;background:var(--orange);border-radius:7px;transition:width .3s}
.bossrow{min-height:54px}
.gresult{text-align:center}.gresult .big{font-size:56px}
.gbadges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ghs{width:100%;border-collapse:collapse;font-size:15px}.ghs td,.ghs th{padding:6px 4px;border-bottom:1px solid var(--sep);text-align:left}.ghs td:not(:first-child),.ghs th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
/* ================= Backup & Sync ================= */
.bksec{margin-top:18px;padding-top:6px;border-top:1px solid var(--sep)}
.bkh{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:14px 0 4px}
.bklabel{display:block;font-size:15px;font-weight:600;margin:10px 0 6px}
.tokrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.tokrow input{flex:1 1 180px;min-width:0;min-height:54px;font-size:16px;padding:0 14px;border:2px solid var(--border);border-radius:14px;background:var(--card2);color:var(--label);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tokrow input:focus{outline:none;border-color:var(--accent)}
.tokrow .btn{min-height:54px}
.bkerr{color:var(--bad);font-size:15px;display:block;margin:6px 0}
.syncbox #syncStatus{margin:8px 0;font-size:15px}
.bkbtns{flex-wrap:wrap;justify-content:flex-start}.bkbtns .btn{flex:1 1 200px}
.tokhelp{margin:12px 0 4px;border:1px solid var(--border);border-radius:14px;padding:0 14px;background:var(--card2)}
.tokhelp summary{min-height:54px;display:flex;align-items:center;font-weight:600;cursor:pointer;color:var(--accent);list-style:none}
.tokhelp summary::-webkit-details-marker{display:none}
.tokhelp summary::before{content:"›";display:inline-block;margin-right:8px;transition:transform .2s}.tokhelp[open] summary::before{transform:rotate(90deg)}
.tokhelp ol{padding-left:22px;margin:0 0 8px;font-size:15px;line-height:1.5}.tokhelp li{margin:4px 0}
.tokhelp p{font-size:14px;line-height:1.45}
.tokhelp a,.syncbox a{color:var(--accent)}
.bknote{background:color-mix(in srgb,var(--accent) var(--pillmix,14%),transparent);border-radius:12px;padding:10px 12px;color:var(--label)}
.bkcmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.bkcmp>div{border:1px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:15px}
.bkcmp b{font-size:15px}
.histlist{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin:8px 0}
.histrow{min-height:54px;width:100%;text-align:left;font:inherit;color:var(--label);background:var(--card);border:2px solid var(--border);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.bkbanner{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.bkbanner .iconbtn{width:44px;height:44px;flex:none}
.btn.danger{background:#b91c1c;color:#fff}

/* Pimsleur words + repeat option */
.alcard .albtns{flex-wrap:wrap}
@media (max-width:430px){.alcard .albtns .btn:not(.small){flex:1 1 140px}}
.pmhome{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:54px;margin:-4px 0 12px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--label);font-size:.92rem;text-align:left;flex-wrap:wrap}
.pmhome .muted{font-size:.82rem}
.pmnote{font-size:.84rem;color:var(--label2);margin:6px 0 10px;line-height:1.4}
.pmnote a{color:var(--accent)}
.seg.pmlv button{min-height:44px}
.pmrow .grow{min-width:0}
.pmconf{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--accentT);color:var(--accent);white-space:nowrap}
.pmconf.medium{background:var(--fill);color:var(--label)}.pmconf.none{background:var(--fill);color:var(--label2)}
.pmsrc{font-size:.72rem;color:var(--label2);white-space:nowrap;margin:0 6px}
.pmdrills{justify-content:flex-start;flex-wrap:wrap}.pmdrills .btn{flex:1 1 150px}
.pmlvrow{flex-wrap:wrap;gap:8px}.pmlvrow .seg{flex:1 1 200px;max-width:260px}
.pmconf.high,.pmdrills .btn.sec,#pmAdd{color:var(--pmink,var(--accent))}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--pmink:#0b5e58}}
:root[data-theme=light]{--pmink:#0b5e58}

/* All words map */
.amsum{font-size:.95rem;margin:2px 2px 10px;color:var(--label)}.amsum b{font-size:1.25rem}
.amchips,.amst{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 2px 8px;margin:0 -2px}
.amchips::-webkit-scrollbar,.amst::-webkit-scrollbar{display:none}
.amchip{flex:none;min-height:54px;min-width:54px;padding:6px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--label);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;line-height:1.2}
.amchip small{font-size:.74rem;font-weight:500;color:var(--label2)}
.amchip.on{background:var(--accentT);border-color:var(--accent);color:var(--pmink,var(--accent));box-shadow:inset 0 0 0 1px var(--accent)}
.amchip.on small{color:var(--label)}
.amkjrow{margin:4px 0 8px}
.amlegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--label2);margin:4px 2px 10px}
.amlegend span{display:inline-flex;align-items:center;gap:5px}
.amlegend i{display:inline-block;width:13px;height:13px;border-radius:3px}
.amk0{background:var(--fill2)}.amk1{background:var(--s1);opacity:.45}.amk2{background:var(--s1)}.amk3{background:var(--s2)}.amk4{background:var(--s3)}.amk5{background:var(--s4)}.amk6{background:var(--s5)}
.amlegend .amdue{background:var(--fill2);position:relative}.amlegend .amdue::after{content:"";position:absolute;right:1px;top:1px;width:5px;height:5px;border-radius:50%;background:var(--label)}
.amlegend .amlee{background:var(--fill2);box-shadow:inset 0 0 0 2px var(--bad)}
.amctl{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 0 6px;margin:0 0 4px}
.amctl .amst{flex:1;min-width:0;padding-bottom:0}
.amzoom{flex:none;width:54px;height:54px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--label);font-size:1.5rem;font-weight:700;line-height:1}
.amzoom:disabled{opacity:.4}
.amhost{position:relative}
.amhost canvas{position:sticky;top:0;display:block;width:100%;touch-action:pan-y}
.amhint{font-size:.8rem;margin:10px 2px}
.amsheet .box{text-align:center}
.amsheet .amread{font-size:1.25rem;margin-top:2px}
.amsheet .ammean{font-size:1.05rem;margin:8px 0}
.amsheet .amstat{font-size:.9rem;color:var(--label2)}
.ammini .minibar{margin:8px 0 12px}
@media (prefers-reduced-motion:reduce){.amchip,.amzoom{transition:none}}
.sfxrow .seg button{min-height:44px;min-width:58px}

/* retype after a miss */
.retype{margin:12px 0 4px;padding:12px;border-radius:16px;border:2px dashed var(--accent);background:var(--accentT);text-align:left}
.retype .rtlabel{display:block;font-weight:600;color:var(--label);font-size:1rem}
.retype .rtlabel b{font-size:1.35rem;color:var(--accent)}

/* ================= Kanaatro (always dark felt, light theme too) ================= */
.ka{position:relative;isolation:isolate;overflow:hidden;margin:0 -6px;padding:10px 10px 14px;border-radius:22px;background-color:#0b3228;color:#f3efe2;min-height:calc(100dvh - 150px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.25);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ka::before{content:"";position:absolute;inset:-50%;z-index:-2;background:radial-gradient(circle at 32% 30%,rgba(52,170,116,.55),transparent 38%),radial-gradient(circle at 70% 62%,rgba(22,120,150,.42),transparent 42%),radial-gradient(circle at 48% 88%,rgba(160,40,96,.26),transparent 38%),conic-gradient(from 0deg,#0b3228,#10453a,#0a2c2a,#123c30,#0b3228);animation:kaSwirl 48s linear infinite;pointer-events:none}
.ka::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.5) 100%)}

/* tiles */

.katile{position:relative;display:grid;place-items:center;height:70px;padding:0;border:0;border-radius:11px;background:linear-gradient(170deg,#fffaf0,#efe3c6);color:#1a1612;box-shadow:0 3px 0 #b5a175,0 7px 14px rgba(0,0,0,.4);transform:rotate(var(--r,0deg));transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;cursor:pointer;touch-action:manipulation}

.kach{font-size:38px;font-weight:800;line-height:1;text-shadow:0 0 1px rgba(0,0,0,.35),1px 1px 0 rgba(0,0,0,.08)}

.katile.kk .kacv{color:#26407f}
.katile.on{transform:translateY(-13px) rotate(0) scale(1.05);box-shadow:0 0 0 3px #ffd166,0 14px 20px rgba(0,0,0,.45)}
.kaord{position:absolute;top:-9px;left:-6px;width:22px;height:22px;border-radius:50%;background-color:#ffd166;color:#1a1a1a;font:900 .78rem/22px system-ui;font-style:normal;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.katile.off{filter:grayscale(1);opacity:.6}
.katile.deal{animation:kaDeal .42s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i) * 55ms)}
@keyframes kaDeal{from{transform:translate(140px,-300px) rotate(30deg);opacity:0}to{transform:rotate(var(--r,0deg));opacity:1}}
.katile.played{animation:kaUp .32s ease-in forwards;pointer-events:none}
@keyframes kaUp{to{transform:translateY(-150px) scale(.75);opacity:0;visibility:hidden}}
.katile.toss{animation:kaToss .28s ease-in forwards;pointer-events:none}
@keyframes kaToss{to{transform:translate(170px,40px) rotate(45deg);opacity:0}}
.kastile{width:46px;height:58px;cursor:default;animation:kaPop .32s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--i) * 60ms)}.kastile .kach{font-size:28px}
.kastile.hit{animation:kaHit .3s cubic-bezier(.3,1.8,.5,1);box-shadow:0 0 0 3px #4cc9f0,0 0 16px #4cc9f0}
@keyframes kaPop{from{transform:translateY(60px) scale(.6);opacity:0}}
@keyframes kaHit{50%{transform:translateY(-8px) scale(1.2)}}
@keyframes kaOut{to{transform:translateX(160px) rotate(20deg);opacity:0}}
/* floats, totals, shake */
.kafloat{position:absolute;z-index:9;transform:translate(-50%,0);padding:2px 8px;border-radius:8px;font:900 .9rem system-ui;white-space:nowrap;pointer-events:none;animation:kaFloat .9s ease-out forwards;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.kafloat.c{background-color:#1a62c4;color:#fff}.kafloat.m{background-color:#c42b2b;color:#fff}.kafloat.x{background-color:#7b2cbf;color:#fff}.kafloat.\$ {background-color:#e0a800;color:#1a1a1a}.kafloat.d{background-color:#2b2b2b;color:#fff}
@keyframes kaFloat{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-46px) scale(1);opacity:0}}

@keyframes kaShake2{10%{transform:translate(-6px,3px) rotate(-.6deg)}30%{transform:translate(6px,-4px) rotate(.6deg)}50%{transform:translate(-5px,2px)}70%{transform:translate(4px,-2px)}90%{transform:translate(-2px,1px)}}

function newWordsForToday(n, exclude, levels = activeLevels()) {

    for (const s of ordered) for (const id of s.ids) if (!S.cards[id] && !exclude.has(id)) out.push(id);
    return out; });

function kanjiForSession(revLevels, newLevels) {

  for (const l of revLevels) if (KJL[l] && KJL[l].loaded) rev.push(...kjDueScan(l).ids.filter(c => KJ[c]));
  let n = S.kanjiPerDay == null ? 3 : S.kanjiPerDay | 0;

  const reviews = due.slice(0, Math.max(target - nNew, Math.ceil(target / 2)));

/* ---------- Speed round ---------- */
function speed(back) {
  studyScreen = true;
  const DUR = 60;
  view.innerHTML = topbar("⚡ Speed Round", `<span class="timer" id="tleft">${DUR}</span>`) +
    `<div class="topbar"><div class="timebar"><div id="tbar" style="width:100%"></div></div><b id="sscore">0 pts</b></div>
     <div id="qhost"><div class="card"><div class="prompt en">Ready?</div><p class="sub">Answer as many JP → EN questions as you can in ${DUR} seconds.<br>Correct: +1 · Wrong: −2 s · 🤷 I don't know (key 0): −1 s</p><button class="btn" id="startBtn">Start!</button></div></div>`;
  bindBack(typeof back === "function" ? back : undefined);
  let t0, timer, q = null, score = 0, wrongs = 0, skips = 0, penalty = 0, over = false, lastTick = DUR;
  const remaining = () => Math.max(0, DUR - (Date.now() - t0) / 1000 - penalty);
  const next = () => {
    if (over) return;
    const pid = pickNext(ALL_IDS);
    if (pid == null) { over = true; clearInterval(timer); q = null; return capView(false, back); }
    const w = WORDS[pid];
    q = renderMC("meaning", w, (ok, el, _h, info) => {
      const idk = !!(info && info.idk);
      grade(w.id, ok);
      if (ok) score++; else if (idk) { skips++; penalty += 1; requeue(w.id); } else { wrongs++; penalty += 2; requeue(w.id); }
      comboHit(ok, el, 8, idk);
      $("#sscore").textContent = score + " pts";
      q = null;
      setTimeout(next, ok ? 350 : 1100);
    }, { noRetype: true });
  };
  const end = () => {
    over = true; clearInterval(timer); q = null; sfx.end();
    const best = score > S.bestSpeed; if (best) { S.bestSpeed = score; save(); confetti(200); }
    addXP(score * 2);
    $("#qhost").innerHTML = `<div class="card"><div class="qtype">Time's up!</div><div class="big">${score}</div><p>correct · ${wrongs + skips} missed${skips ? ` (${skips} I don't know)` : ""}${best ? " · <b>🏆 New best!</b>" : ` · best ${S.bestSpeed}`}</p><p class="sub">Bonus +${score * 2} XP</p><button class="btn" id="again">Play again</button></div>`;
    $("#again").onclick = () => go(() => speed(back));
  };
  $("#startBtn").onclick = () => {
    t0 = Date.now(); next();
    if (over) return;   // daily new-word limit: nothing to ask (capped card shown)
    timer = setInterval(() => {
      const r = remaining(); $("#tleft").textContent = Math.ceil(r); $("#tbar").style.width = (r / DUR * 100) + "%";
      if (r <= 5 && Math.ceil(r) !== lastTick) { lastTick = Math.ceil(r); sfx.tick(); }
      if (r <= 0) end();
    }, 100);
  };
  const onKey = e => { if (q && q.choose && /^[1-4]$/.test(e.key)) q.choose(+e.key - 1); else if (q && q.idk && isIdkKey(e)) { e.preventDefault(); q.idk(); } };
  addEventListener("keydown", onKey);
  cleanup = () => { clearInterval(timer); over = true; removeEventListener("keydown", onKey); };
}

function match(pool = ALL_IDS, back = home, title = "🧩 Matching Pairs") {
  studyScreen = true;
  const t0 = Date.now(); let misses = 0, sel = null, timer;
  const ids = []; let guard = 0, nNew = 0;
  while (ids.length < 6 && guard++ < 400) {
    const id = pickNext(pool);
    if (id == null) break;
    if (isNewWord(id) && nNew >= newLeft()) continue;   // daily new-word limit
    if (!ids.includes(id) && !ids.some(o => conflicts(WORDS[o], WORDS[id], "match"))) { ids.push(id); if (isNewWord(id)) nNew++; }
  }
  const N = ids.length; let left = N;
  view.innerHTML = topbar(title, `<span class="muted" id="mtime">0s</span>`) + `<p class="muted" style="margin:0 0 10px">Tap a Japanese word, then its meaning. Best: ${S.bestMatch ? S.bestMatch + "s" : "—"}</p><div class="match" id="mgrid"></div>`;
  bindBack(back);
  if (N < 2) { if (capReached() && pool.some(id => isNewWord(id))) { $("#mgrid").outerHTML = `<div id="qhost"></div>`; return capView(false, back); } $("#mgrid").innerHTML = `<p class="muted">Not enough distinct words here for a board.</p>`; return; }
  ids.forEach(id => markNew(id));   // the board shows them: they count as introduced
  timer = setInterval(() => { const m = $("#mtime"); if (m) m.textContent = Math.floor((Date.now() - t0) / 1000) + "s"; }, 250);
  cleanup = () => clearInterval(timer);
  const jpSide = shuffle(ids), enSide = shuffle(ids), grid = $("#mgrid");
  for (let i = 0; i < N; i++) {
    const a = WORDS[jpSide[i]], b = WORDS[enSide[i]];
    grid.insertAdjacentHTML("beforeend", `<button class="tile jpt jp" data-id="${a.id}" data-side="jp">${esc(a.jp)}${S.romaji ? `<div style="font-size:.75rem;color:#777;font-family:system-ui">${esc(ROMA(a.kana))}</div>` : ""}</button><button class="tile" data-id="${b.id}" data-side="en">${esc(b.en)}</button>`);
  }
  const missed = new Set();
  grid.onclick = e => {
    const t = e.target.closest(".tile"); if (!t || t.classList.contains("done")) return;
    if (t.dataset.side === "jp") speak(WORDS[+t.dataset.id]);
    if (!sel) { sel = t; t.classList.add("sel"); sfx.click(); return; }
    if (sel === t) { t.classList.remove("sel"); sel = null; return; }
    if (sel.dataset.side === t.dataset.side) { sel.classList.remove("sel"); sel = t; t.classList.add("sel"); sfx.click(); return; }
    const a = sel, b = t; sel = null; a.classList.remove("sel");
    if (a.dataset.id === b.dataset.id) {
      const id = +a.dataset.id; grade(id, !missed.has(id), { game: true, listen: false }); comboHit(true, b, 12);
      a.classList.add("done"); b.classList.add("done"); if (--left === 0) finish();
    } else {
      misses++; comboHit(false);
      [a, b].forEach(x => { x.classList.add("bad"); setTimeout(() => x.classList.remove("bad"), 400); });
      missed.add(+(a.dataset.side === "jp" ? a : b).dataset.id);
    }
  };
  function finish() {
    clearInterval(timer);
    const secs = Math.round((Date.now() - t0) / 1000), perfect = misses === 0;
    const best = N === 6 && (!S.bestMatch || secs < S.bestMatch); if (best) { S.bestMatch = secs; save(); }
    if (perfect) confetti(150);
    const bonus = perfect ? 30 : 10; addXP(bonus);
    grid.innerHTML = `<div class="card" style="grid-column:1/-1"><div class="qtype">Board cleared!</div><div class="big">${secs}s</div><p>${misses} miss${misses === 1 ? "" : "es"}${perfect ? " · ✨ Perfect!" : ""}${best ? " · 🏆 New best time" : ""}</p><p class="sub">+${bonus} XP bonus</p><button class="btn" id="again">Next board</button></div>`;
    $("#again").onclick = () => go(() => match(pool, back, title));
  }
}

/* ---------- Kana session (endless, SRS-picked) ---------- */
function kanaSession(mode) {
  studyScreen = true;
  const titles = { k2r: "🔤 Kana → Romaji", r2k: "🅰️ Romaji → Kana", type: "⌨️ Type Romaji", listen: "🎧 Kana Listening" };
  const pool = kPool(); let right = 0, total = 0, q = null, answered = false, adv = null;
  kQueue = []; kRecent = [];
  view.innerHTML = topbar(titles[mode], `<span class="muted" id="score">0/0</span>`) + `<div id="qhost"></div><p class="muted kbdhint" style="text-align:center;font-size:.8rem">Keys <kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>Enter</kbd> next</p>`;
  bindBack(kanaHome);
  const next = () => {
    clearTimeout(adv); answered = false;
    const it = KITEMS[kPick(pool)];
    const onAnswer = (ok, el, info) => {
      answered = true; total++; if (ok) right++;
      kGrade(it.id, ok); if (!ok) kRequeue(it.id);

      $("#score").textContent = `${right}/${total}`;
      const fb = $("#fb"), nb = document.createElement("div"); nb.className = "btnrow"; nb.innerHTML = `<button class="btn" id="nextBtn">Next →</button>`; fb.appendChild(nb);
      $("#nextBtn").onclick = next;

    q = mode === "type" ? kRenderType(it, onAnswer) : kRenderMC(mode, it, pool, onAnswer);
  };
  const onKey = e => {
    if (document.querySelector(".modal")) return;
    if (e.target.tagName === "INPUT" && !e.target.disabled) return;
    if (!answered && q && q.choose && /^[1-4]$/.test(e.key)) q.choose(+e.key - 1);
    else if (!answered && q && q.idk && isIdkKey(e)) { e.preventDefault(); q.idk(); }
    else if (answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
  };
  addEventListener("keydown", onKey);
  cleanup = () => { removeEventListener("keydown", onKey); clearTimeout(adv); };
  next();
}

  const onKey = e => { if (q && q.choose && /^[1-4]$/.test(e.key)) q.choose(+e.key - 1); else if (q && q.idk && isIdkKey(e)) { e.preventDefault(); q.idk(); } };

  cleanup = () => { clearInterval(timer); over = true; removeEventListener("keydown", onKey); };

/* ---------- Hiragana ↔ katakana matching ---------- */
function kanaMatch() {
  studyScreen = true;
  const hs = [];
  for (const g of KGROUPS) if (KBYGROUP.h[g.id] && KS.sel[g.id] !== false && (kUnlocked("h", g.id) || kUnlocked("k", g.id))) hs.push(...KBYGROUP.h[g.id]);
  kQueue = []; kRecent = [];
  const pick = []; let guard = 0;
  while (pick.length < Math.min(6, hs.length) && guard++ < 300) { const id = kPick(hs); if (!pick.includes(id)) pick.push(id); }
  view.innerHTML = topbar("🧩 ひらがな ↔ カタカナ", `<span class="muted" id="mtime">0s</span>`) + `<p class="muted" style="margin:0 0 10px">Match each hiragana (left) with its katakana (right). Best: ${KS.bestMatch ? KS.bestMatch + "s" : "—"}</p><div class="match" id="mgrid"></div>`;
  bindBack(kanaHome);
  if (pick.length < 2) { $("#mgrid").innerHTML = `<p class="muted">Select/unlock at least one row first.</p>`; return; }
  const t0 = Date.now(), timer = setInterval(() => { const m = $("#mtime"); if (m) m.textContent = Math.floor((Date.now() - t0) / 1000) + "s"; }, 250);
  cleanup = () => clearInterval(timer);
  const L = shuffle(pick), R = shuffle(pick), grid = $("#mgrid"); let sel = null, left = pick.length, misses = 0; const missed = new Set();
  for (let i = 0; i < pick.length; i++) grid.insertAdjacentHTML("beforeend", `<button class="tile jpt jp" data-id="${esc(L[i])}" data-side="h" style="font-size:2rem">${esc(L[i])}</button><button class="tile jpt jp" data-id="${esc(R[i])}" data-side="k" style="font-size:2rem">${esc(KITEMS[R[i]].pair)}</button>`);
  grid.onclick = e => {
    const t = e.target.closest(".tile"); if (!t || t.classList.contains("done")) return;
    kSay(KITEMS[t.textContent]);
    if (!sel) { sel = t; t.classList.add("sel"); return; }
    if (sel === t) { t.classList.remove("sel"); sel = null; return; }
    if (sel.dataset.side === t.dataset.side) { sel.classList.remove("sel"); sel = t; t.classList.add("sel"); return; }
    const a = sel, b = t; sel = null; a.classList.remove("sel");
    if (a.dataset.id === b.dataset.id) {
      const h = a.dataset.id, ok = !missed.has(h); kGrade(h, ok, { game: true }); kGrade(KITEMS[h].pair, ok, { game: true }); comboHit(true, b, 6);
      a.classList.add("done"); b.classList.add("done");
      if (--left === 0) { clearInterval(timer); const secs = Math.round((Date.now() - t0) / 1000), best = pick.length === 6 && (!KS.bestMatch || secs < KS.bestMatch); if (best) { KS.bestMatch = secs; ksave(); } if (!misses) confetti(140); addXP(misses ? 8 : 20);
        grid.innerHTML = `<div class="card" style="grid-column:1/-1"><div class="qtype">Board cleared!</div><div class="big">${secs}s</div><p>${misses} miss${misses === 1 ? "" : "es"}${best ? " · 🏆 New best" : ""}</p><button class="btn" id="again">Next board</button></div>`;
        $("#again").onclick = () => go(kanaMatch); kMaybeRead(); }
    } else { misses++; comboHit(false); missed.add(a.dataset.id); missed.add(b.dataset.id); [a, b].forEach(x => { x.classList.add("bad"); setTimeout(() => x.classList.remove("bad"), 400); }); }
  };
}

/* ---------- offline audio: download everything into the Cache API (same cache the service worker uses) ---------- */
const AUDIO_CACHE = "n5vq-audio-v1";
const DATA_CACHE = "n5vq-data-v1";
function allAudioPaths(levels = ["n5"]) {
  const p = new Set();
  levels.filter(l => LV[l].loaded).forEach(l => LV[l].ids.forEach(id => { p.add(wordAudioPath(WORDS[id])); ex(id).forEach(x => p.add(sentenceAudioPath(x))); }));
  Object.values(KITEMS).forEach(it => p.add(`k/${kFile(it)}.mp3`));
  if (LV.pm && LV.pm.loaded) LV.pm.ids.forEach(id => p.add(wordAudioPath(WORDS[id])));   // Pimsleur set (small)
  if (levels.includes("n5")) {   // N5 grammar examples + drill sentences, graded-reading narration, mock-test listening
    if (typeof GR_DATA !== "undefined") GR_DATA.forEach(g => { g.ex.forEach((e, i) => p.add(grAudio(g.id, i))); g.d.forEach((d, i) => { if (grDrillSentence(d)) p.add(grAudio(g.id, i, true)); }); });
    if (typeof RD_DATA !== "undefined") RD_DATA.forEach(st => st.s.forEach((x, i) => p.add(rdAudio(st.id, i))));
    if (typeof MK_BANK !== "undefined") ["lt", "lp", "lu", "lq"].forEach(k => MK_BANK[k].forEach(it => p.add(`mk/${it.id}.mp3`)));
  }
  return [...p];
}
/* cache one versioned data file and drop older versions of the same file (the SW does the same on normal fetches) */
async function cachePutFresh(cache, url) {
  if (await cache.match(url)) return;
  const r = await fetch(url); if (!r.ok) return;
  const path = new URL(url).pathname;
  for (const old of await cache.keys()) if (new URL(old.url).pathname === path && old.url !== url) await cache.delete(old);
  await cache.put(url, r);
}
async function downloadAllAudio(btn, info, levels = ["n5"]) {
  if (!("caches" in window)) return;
  btn.disabled = true;
  info.textContent = "Loading word lists…";
  const dcache = await caches.open(DATA_CACHE), failedLv = [];
  for (const l of levels) {
    for (const strokes of [false, true]) try { await cachePutFresh(dcache, new URL(kjUrl(l, strokes), location.href).href); } catch (e) {}
    try { await loadKanji(l); } catch (e) {}
    try { await cachePutFresh(dcache, new URL(`data/games-${l}.json?v=${(GAMEINFO[l] || {}).v || 1}`, location.href).href); await loadGames(l); } catch (e) {}
    if (l === "n5") continue;                      // N5 is built into the page
    const url = new URL(`data/${l}.json?v=${LV[l].info.v || 1}`, location.href).href;
    try { await cachePutFresh(dcache, url); } catch (e) {}
    if (!(await loadLevel(l))) failedLv.push(l);
  }
  const paths = allAudioPaths(levels), cache = await caches.open(AUDIO_CACHE);
  let done = 0, failed = 0, i = 0;
  const base = new URL(AUDIO_BASE, location.href).href;
  const worker = async () => {
    while (i < paths.length) {
      const url = base + paths[i++];
      try { if (!(await cache.match(url))) { const r = await fetch(url); if (r.ok) await cache.put(url, r); else failed++; } } catch (e) { failed++; }
      done++; if (done % 20 === 0 || done === paths.length) info.textContent = `Downloading… ${done}/${paths.length}${failed ? ` (${failed} failed)` : ""}`;
    }
  };
  await Promise.all([1, 2, 3, 4, 5, 6].map(worker));
  info.textContent = (failed || failedLv.length) ? `Done with ${failed} failures${failedLv.length ? ` (couldn't load ${failedLv.map(LNAME).join(", ")})` : ""} — try again later.` : `✅ ${levels.map(LNAME).join(", ")}: all ${paths.length} audio files saved for offline use.`;
  btn.disabled = false; btn.textContent = "Re-check";
}

/* ================= Backup & Sync =================
   • Backup file: every app store (vocab SRS, kana, kanji, goals/time history, path/daily sessions, games, audio lesson,
     settings) as one versioned JSON file, shared via the Web Share API (iPhone: Save to Files / iCloud) or downloaded.
   • Gist sync: each person pastes their OWN GitHub token (gist scope only). It lives only in this device's localStorage
     (SYKEY), is never logged, and is never part of a backup or the gist. Sync = pull → merge → push to a SECRET gist.
   • Merge: SRS cards keep the latest review (then most reviews), counters take the max, history days take the max per
     field, lists are unioned, settings are latest-wins using per-field modified stamps (SMKEY). */
const SYKEY = "jlptVocabQuest.sync.v1";        // this device only: token, gist id, status — never exported
const SMKEY = "jlptVocabQuest.syncmeta.v1";    // per-field "modified at" stamps used by the merge
const SNAPKEY = "jlptVocabQuest.snapshot.v1";  // safety snapshot taken before any restore (for Undo)
const GIST_DESC = "JLPT Vocab Quest sync", GIST_FILE = "jlpt-quest-sync.json", BK_APP = "jlpt-vocab-quest", BK_VER = 1;
const SYNC_STORES = [["S", KEY], ["KS", KKEY], ["JS", JKEY], ["TS", TKEY], ["AL", AKEY]];
const stGet = n => n === "S" ? S : n === "KS" ? KS : n === "JS" ? JS : n === "TS" ? TS : AL;
const syDefault = () => ({ token: "", gistId: "", lastSync: 0, lastTry: 0, err: "", errAt: 0, rateUntil: 0, lastBackup: 0, remind: false, snooze: 0, device: "" });
let SY; try { SY = Object.assign(syDefault(), JSON.parse(localStorage.getItem(SYKEY) || "{}")); } catch (e) { SY = syDefault(); }
if (!SY.device) SY.device = Math.random().toString(36).slice(2, 10);
function sysave() { try { localStorage.setItem(SYKEY, JSON.stringify(SY)); } catch (e) {} }
sysave();
let SM = null; try { SM = JSON.parse(localStorage.getItem(SMKEY) || "null"); } catch (e) { SM = null; }

/* ---------- merge rules (anything not listed is a setting: latest-wins by modified stamp) ---------- */

  S: { cards: "cards", xp: "max", answered: "max", bestSpeed: "max", bestMatch: "max", notes: "mapLww", dailyHistory: "mapMax", dailies: "dailies",

       newLog: "mapUnion", newLogK: "mapUnionS", revLog: "days", gcards: "cards", newLogG: "mapUnionS", rdDone: "mapMax", rdDay: "mapUnionS", mock: "attempts", spkLog: "days", confuse: "days" },   // daily new-item logs: union per day, so the cap holds across devices

  return [...new Set(String(w.kana).split(/[;、]/).map(s => s.replace(/\(.*?\)/g, "").replace(/[～〜\s]/g, "").normalize("NFC")).filter(s => s.length >= 2 && /^[\u3041-\u3096\u30A1-\u30FA\u30FC]+$/.test(s)))];
}
const kaCat = (w, kataPlay) => kataPlay || /^[\u30A1-\u30FA\u30FC]+$/.test(kaSpellings(w)[0] || "") ? "kata" : w.pos === "v" ? "verb" : w.pos === "ai" || w.pos === "na" ? "adj" : w.pos === "num" || w.pos === "suf" ? "count" : w.pos === "n" || w.pos === "pn" ? "noun" : "phrase";

/* ---------- dictionary + deck ---------- */
function kaDict(l) {
  const ids = new Set(LV[l].ids);
  for (const k in S.cards) if (WORDS[k]) ids.add(+k);
  const map = new Map(), work = new Set();
  (LV[l].sets || []).forEach(s => { if (/Work|Society/i.test(s.name)) s.ids.forEach(i => work.add(i)); });
  for (const id of ids) { const w = WORDS[id]; if (!w) continue; for (const sp of kaSpellings(w)) { const k = kaNorm(sp); if (!map.has(k)) map.set(k, []); map.get(k).push(id); } }
  return { map, work };
}
const kaPlayable = () => true;   // every library word is playable now (unseen words over the daily limit score but aren't added)
/* whole-library index (all loaded levels): normalized spelling → ids, plus per-key char counts for fast hand matching. Built once per set of loaded levels. */
let KA_LIB = null;
function kaLib() {
  const sig = LEVELS.filter(l => LV[l] && LV[l].loaded).join(",");
  if (KA_LIB && KA_LIB.sig === sig) return KA_LIB;
  const map = new Map();
  for (const l of LEVELS) { if (!LV[l] || !LV[l].loaded) continue; for (const id of LV[l].ids) { const w = WORDS[id]; for (const sp of kaSpellings(w)) { const k = kaNorm(sp); const a = map.get(k); if (a) { if (!a.includes(id)) a.push(id); } else map.set(k, [id]); } } }
  const keys = [];
  for (const [key, ids] of map) { const cnt = {}; for (const ch of key) cnt[ch] = (cnt[ch] || 0) + 1; keys.push({ key, ids, len: key.length, cnt: Object.entries(cnt) }); }
  keys.sort((a, b) => a.len - b.len);
  return (KA_LIB = { sig, map, keys, size: map.size });
}
const KA_DISC = { chips: 15, mult: 2 };
const kaIsDisc = (K, id) => !S.cards[id] && !K.found.has(id);
/* frequency of each kana over the playable words → chip tiers (common 2 … rare 10) and the deck */
function kaFreq(dict) {
  const f = {};
  for (const [, ids] of dict.map) { const w = WORDS[ids[0]], sp = kaSpellings(w).find(s => dict.map.get(kaNorm(s))) || kaSpellings(w)[0]; for (const ch of sp) f[ch] = (f[ch] || 0) + 1; }
  return f;
}
function kaChipTable(freq) {
  const keys = Object.keys(freq).sort((a, b) => freq[b] - freq[a] || (a < b ? -1 : 1)), N = keys.length, t = {};
  keys.forEach((ch, i) => { const r = i / Math.max(1, N); t[kaNorm(ch)] = r < 0.2 ? 2 : r < 0.45 ? 3 : r < 0.7 ? 5 : r < 0.9 ? 7 : 10; });
  return t;
}
function kaBuildDeck(freq, rng, n = 52) {
  const keys = Object.keys(freq).sort(), tot = keys.reduce((s, k) => s + freq[k], 0), out = [];
  const alloc = keys.map(k => ({ k, x: freq[k] / tot * n })); alloc.forEach(a => { for (let i = 0; i < Math.floor(a.x); i++) out.push(a.k); });
  alloc.sort((a, b) => (b.x % 1) - (a.x % 1) || (a.k < b.k ? -1 : 1));
  for (let i = 0; out.length < n && i < alloc.length; i++) out.push(alloc[i].k);

}

/* every word the tiles can spell (multiset, script-insensitive; ー literal), best first */
function kaPossible(K, tiles = K.hand) {
  const have = {}; tiles.forEach(t => { const k = kaNorm(t.ch); have[k] = (have[k] || 0) + 1; });
  const out = [], n = tiles.length;
  for (const e of K.lib.keys) {
    if (e.len > n) break;
    let ok = true;
    for (const [ch, c] of e.cnt) if ((have[ch] || 0) < c) { ok = false; break; }
    if (!ok) continue;
    const key = e.key, id = kaPickId(K, e.ids); if (id == null) continue;
    const used = new Set(), seq = [...key].map(ch => { const i = tiles.findIndex((t, j) => !used.has(j) && kaNorm(t.ch) === ch); used.add(i); return i; });

}
/* commonness tier for hints: seen words, then by JLPT level (N5 most common) */
const kaCommon = (K, id) => S.cards[id] ? 0 : 1 + (KA_LVB[WORDS[id].lvl] ?? 4);
/* homophones: prefer due, then seen, then unseen words from the current level, then the lowest (most common) level */
function kaPickId(K, ids) {
  if (!ids || !ids.length) return null;
  const now = Date.now();
  return ids.find(id => S.cards[id] && card(id).due <= now) ?? ids.find(id => S.cards[id]) ?? ids.find(id => WORDS[id].lvl === K.l) ?? ids.slice().sort((a, b) => (KA_LVB[WORDS[a].lvl] ?? 4) - (KA_LVB[WORDS[b].lvl] ?? 4) || a - b)[0];

/* ---------- scoring (pure; returns the ordered steps the animation plays back) ---------- */
function kaScore(K, id, tiles, o = {}) {
  const w = WORDS[id], len = tiles.length, boss = K.blind === 2 ? K.boss : null;
  const kataPlay = tiles.some(t => kaIsKata(t.ch)) && tiles.every(t => kaIsKata(t.ch) || t.ch === "ー");
  const cat = kaCat(w, kataPlay), lv = K.lv[cat] || 0, base = KA_CATS[cat], steps = [];
  let chips = base.chips + lv * 10 + len * 5, mult = base.mult + lv + Math.max(0, len - 2) + (KA_LVB[w.lvl] || 0);
  steps.push({ k: "base", label: `${base.n}${lv ? " lv." + (lv + 1) : ""} · ${len} kana`, chips, mult });
  const disc = o.disc ?? kaIsDisc(K, id);
  if (disc) { chips += KA_DISC.chips; mult += KA_DISC.mult; steps.push({ k: "disc", label: "Discovery!", chips: KA_DISC.chips, mult: KA_DISC.mult }); }
  const kanjiOk = w.hasKanji && boss !== "mask";
  if (kanjiOk) { mult += 1; steps.push({ k: "kanji", label: "Kanji word", mult: 1 }); }
  const debuff = (boss === "verb" && w.pos !== "v") || (boss === "neck" && len < 3) || (boss === "imp" && kaFuncWord(w));
  tiles.forEach((t, i) => {
    const off = boss === "kata" && kaIsHira(t.ch), v = off ? 0 : (K.chipT[kaNorm(t.ch)] || 4) + (kaMark(t.ch) ? 1 : 0);
    chips += v; steps.push({ k: "tile", i, chips: v, off });
  });
  const marks = tiles.filter(t => kaMark(t.ch)).length, smalls = tiles.filter(t => KA_SMALL.has(t.ch)).length;
  const due = S.cards[id] && card(id).due <= Date.now();
  K.jokers.forEach((j, ji) => {
    const s = { k: "joker", ji, id: j.id };
    if (j.id === "tanuki" && K.tanuki) { s.mult = 4 * K.tanuki; mult += s.mult; }
    else if (j.id === "demon" && marks) { s.x = Math.pow(1.5, marks); mult *= s.x; }
    else if (j.id === "salary" && (K.dict.work.has(id) || KA_WORK.test(w.en))) { s.chips = chips; chips *= 2; }
    else if (j.id === "leech" && isLeech(id)) { s.x = 3; mult *= 3; }
    else if (j.id === "haiku" && len === 5) { s.x = 2; mult *= 2; }
    else if (j.id === "ronin" && cat === "kata") { s.chips = 30; chips += 30; }
    else if (j.id === "kappa" && smalls) { s.mult = 3 * smalls; mult += s.mult; }
    else if (j.id === "neko" && w.hasKanji) { s.money = 1; }
    else if (j.id === "daruma" && K.streak) { s.mult = 2 * K.streak; mult += s.mult; }
    else if (j.id === "kitsune" && due) { s.x = 2; mult *= 2; }
    else if (j.id === "shodo" && kanjiOk && kaKanjiN(w)) { s.mult = 4 * kaKanjiN(w); mult += s.mult; }
    else return;
    steps.push(s);
  });
  if (o.wrong) { mult /= 2; steps.push({ k: "wrong", label: "Wrong meaning ÷2" }); }
  if (debuff) steps.push({ k: "debuff", label: `${KA_BOSSES[boss].n}: no score` });

  const total = debuff ? 0 : Math.floor(chips * mult);
  return { chips, mult, total, steps, cat, kataPlay, debuff, disc, animal: KA_ANIMAL.test(w.en) };
}

function kaN(f, when = 0, dur = .15, vol = .1, kind = "marimba") {
  if (!S.sound) return;
