<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N5 Vocab Quest</title>
<style>
:root{--bg:#1b1f3b;--bg2:#262b52;--card:#fffdf7;--ink:#23213a;--accent:#ff5a7a;--accent2:#ffc857;--good:#2ec4b6;--bad:#ff6b6b;--muted:#8a8fb8;--radius:18px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#3a3f7a 0,var(--bg) 60%) fixed;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif}
button{font:inherit;cursor:pointer;border:none}
#app{max-width:760px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.5px;cursor:pointer}
.logo span{color:var(--accent2)}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:600;white-space:nowrap}
.xpbar{height:8px;background:#ffffff22;border-radius:8px;overflow:hidden;margin:4px 0 14px}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.xplabel{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;justify-content:flex-start;background:var(--bg2);border-radius:var(--radius);padding:18px 14px;text-align:left;color:#fff;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.mode:hover,.mode:focus{transform:translateY(-3px);border-color:var(--accent2);box-shadow:0 8px 24px #0005;outline:none}
.mode .ic{font-size:2rem}.mode h3{margin:6px 0 4px}.mode p{margin:0;color:var(--muted);font-size:.85rem}
.panel{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-top:14px}
.panel h2{margin:0 0 10px;font-size:1.1rem}
.progress-big{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ring{width:92px;height:92px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#map{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3px;margin-top:10px}
#map div{aspect-ratio:1;border-radius:3px;cursor:pointer}
.b0{background:#3a3f6a}.b1{background:#ff6b6b}.b2{background:#ff9f5a}.b3{background:#ffc857}.b4{background:#7bd88f}.b5{background:#2ec4b6}
.card{background:var(--card);color:var(--ink);border-radius:var(--radius);padding:22px 18px;text-align:center;box-shadow:0 12px 30px #0006;position:relative}
.prompt{font-size:clamp(2.6rem,11vw,4.4rem);line-height:1.2;margin:10px 0 4px;word-break:break-word}
.prompt.en{font-size:clamp(1.4rem,5.5vw,2rem);font-family:inherit;font-weight:700}
.sub{color:#6b6890;min-height:1.4em;font-size:1.15rem}
.sub.jp{font-size:1.5rem}
.qtype{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:#8a86b0;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(max-width:480px){.choices{grid-template-columns:1fr}}
.choice{background:#fff;border:2px solid #e3e0f3;border-radius:14px;padding:14px 18px;color:var(--ink);font-size:1.05rem;min-height:64px;transition:transform .1s,background .2s;position:relative}
.choice .k{position:absolute;left:8px;top:6px;font-size:.7rem;color:#aaa}
.choice.jpc{font-size:1.6rem}
.choice.jpc small{display:block;font-size:.85rem;color:#777}
.choice:hover{border-color:var(--accent)}
.choice:active{transform:scale(.97)}
.choice.right{background:var(--good);color:#fff;border-color:var(--good);animation:pop .35s}
.choice.wrong{background:var(--bad);color:#fff;border-color:var(--bad);animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}
.btn.sec{background:#ffffff1a}
.btn.small{padding:6px 12px;font-size:.9rem}
.iconbtn{background:#ffffff1a;color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.1rem}
.card .iconbtn{position:absolute;right:12px;top:12px;background:#eee9ff;color:var(--ink)}
.combo{font-weight:800;color:var(--accent2);transition:transform .2s;display:inline-block}
.combo.bump{animation:pop .3s}
.feedback{min-height:1.6em;margin-top:12px;font-weight:600}
.floatxp{position:fixed;font-weight:800;color:var(--accent2);pointer-events:none;animation:floatup 1s forwards;font-size:1.3rem;text-shadow:0 2px 6px #0008;z-index:50}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.timer{font-size:1.4rem;font-weight:800}
.timebar{height:10px;background:#ffffff22;border-radius:8px;overflow:hidden;flex:1;min-width:120px}
.timebar>div{height:100%;background:linear-gradient(90deg,var(--good),var(--accent2),var(--bad));transition:width .2s linear}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);color:var(--ink);border-radius:14px;padding:12px 8px;min-height:70px;font-size:1rem;border:3px solid transparent;transition:all .2s}
.tile.jpt{font-size:1.5rem}
.tile.sel{border-color:var(--accent);transform:scale(1.03)}
.tile.done{opacity:0;transform:scale(.6);pointer-events:none}
.tile.bad{animation:shake .35s;border-color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff14}
.row:last-child{border-bottom:none}
.switch{position:relative;width:52px;height:30px;background:#ffffff33;border-radius:30px;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--good)}.switch.on::after{left:25px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .box{background:var(--bg2);border-radius:var(--radius);padding:22px;max-width:420px;width:100%;text-align:center;animation:pop .3s}
.big{font-size:2.6rem;font-weight:800;color:var(--accent2)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.hidden{display:none!important}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);padding:10px 18px;border-radius:999px;font-weight:700;z-index:70;animation:pop .3s}
footer{margin-top:24px;font-size:.75rem;color:var(--muted);text-align:center}
footer a{color:var(--muted)}
.wordinfo .prompt{font-size:3rem}
kbd{background:#ffffff22;border-radius:4px;padding:1px 5px;font-size:.8em}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app">
  <header>
    <div class="logo" id="homeLogo">⛩️ N5 Vocab <span>Quest</span></div>
    <div class="stats">
      <div class="pill" title="Level">⭐ Lv <b id="sLevel">1</b></div>
      <div class="pill" title="Daily streak">🔥 <b id="sStreak">0</b>d</div>
      <div class="pill" title="Mastered words">🏆 <b id="sMastered">0</b>/<span id="sTotal">0</span></div>
      <button class="iconbtn" id="soundBtn" title="Toggle sound">🔊</button>
      <button class="iconbtn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </header>
  <div class="xplabel"><span id="xpText">0 XP</span><span id="xpNext"></span></div>
  <div class="xpbar"><div id="xpFill" style="width:0"></div></div>

  <main id="view"></main>

  <footer>Vocabulary: <span id="srcInfo"></span></footer>
</div>

const todayStr = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const WORDS = VOCAB.map((v, i) => ({ id: i, jp: v[0], kana: v[1], en: v[2], hasKanji: v[0] !== v[1] && /[\u4e00-\u9fff々]/.test(v[0]) }));
const KANJI_IDS = WORDS.filter(w => w.hasKanji).map(w => w.id);

/* ================= Romaji converter ================= */
const ROMA = (() => {
  const base = {
    あ:"a",い:"i",う:"u",え:"e",お:"o",か:"ka",き:"ki",く:"ku",け:"ke",こ:"ko",さ:"sa",し:"shi",す:"su",せ:"se",そ:"so",
    た:"ta",ち:"chi",つ:"tsu",て:"te",と:"to",な:"na",に:"ni",ぬ:"nu",ね:"ne",の:"no",は:"ha",ひ:"hi",ふ:"fu",へ:"he",ほ:"ho",
    ま:"ma",み:"mi",む:"mu",め:"me",も:"mo",や:"ya",ゆ:"yu",よ:"yo",ら:"ra",り:"ri",る:"ru",れ:"re",ろ:"ro",わ:"wa",ゐ:"wi",ゑ:"we",を:"wo",ん:"n",
    が:"ga",ぎ:"gi",ぐ:"gu",げ:"ge",ご:"go",ざ:"za",じ:"ji",ず:"zu",ぜ:"ze",ぞ:"zo",だ:"da",ぢ:"ji",づ:"zu",で:"de",ど:"do",
    ば:"ba",び:"bi",ぶ:"bu",べ:"be",ぼ:"bo",ぱ:"pa",ぴ:"pi",ぷ:"pu",ぺ:"pe",ぽ:"po",ゔ:"vu",
    ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o",ゃ:"ya",ゅ:"yu",ょ:"yo",ゎ:"wa"
  };
  const yoon = { ゃ:"a", ゅ:"u", ょ:"o" };
  const toHira = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  return function (str) {
    const s = toHira(str);
    let out = "";
    for (let i = 0; i < s.length; i++) {
      const c = s[i], n = s[i + 1];
      if (c === "っ") { // small tsu: double next consonant
        const nx = n && base[n] ? base[n] : "";
        out += nx ? (nx.startsWith("ch") ? "t" : nx[0]) : "'";
        continue;
      }
      if (c === "ー") { const m = out.match(/[aeiou]$/); out += m ? m[0] : "-"; continue; }
      if (c === "ん") { out += (n && /[あいうえおやゆよ]/.test(n)) ? "n'" : "n"; continue; }
      if (base[c] !== undefined) {
        let r = base[c];
        if (n && yoon[n] && r.endsWith("i") && r.length > 1) { // きゃ etc.
          const stem = r.slice(0, -1);
          r = (/^(sh|ch|j)$/.test(stem) ? stem : stem + "y") + yoon[n]; i++;
        } else if (n && /[ぁぃぅぇぉ]/.test(n) && r.length > 1 && !/[ゃゅょ]/.test(c)) { // ティ, ファ etc.
          const stem = r === "fu" ? "f" : r === "tsu" ? "ts" : r === "vu" ? "v" : r.slice(0, -1);
          r = stem + base[n]; i++;
        }
        out += r; continue;
      }
      out += c === "～" || c === "〜" ? "~" : c;
    }
    return out;
  };
})();

/* ================= State / persistence ================= */
const KEY = "n5VocabQuest.v1";
const defaultState = () => ({ cards: {}, xp: 0, streak: 0, lastDay: null, sound: true, romaji: true, speech: true, autoSpeak: false, bestSpeed: 0, bestMatch: 0, answered: 0 });
let S;
try { S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { S = defaultState(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ================= Spaced repetition (Leitner, 6 boxes) =================
   box 0 = new/unseen. Correct -> box+1, wrong -> box 1 (due in ~1 min, and re-queued
   within the current session). Box >= 4 counts as "mastered". */
const MIN = 60e3, DAY = 864e5;
const INTERVALS = [0, 1 * MIN, 10 * MIN, 1 * DAY, 3 * DAY, 7 * DAY, 16 * DAY];
const MAX_BOX = 6, MASTER_BOX = 4;
const card = id => S.cards[id] || { box: 0, due: 0, ok: 0, bad: 0 };
function grade(id, correct) {
  const c = Object.assign({}, card(id));
  if (correct) { c.box = Math.min(MAX_BOX, c.box + 1); c.ok++; }
  else { c.box = 1; c.bad++; }
  c.due = Date.now() + INTERVALS[c.box] * (correct ? (0.9 + Math.random() * 0.2) : 1);
  S.cards[id] = c;
  S.answered++;
  touchStreak();
  save();
}
const masteredCount = () => WORDS.reduce((n, w) => n + (card(w.id).box >= MASTER_BOX ? 1 : 0), 0);
const seenCount = () => Object.keys(S.cards).length;

let sessionQueue = []; // ids missed this session that must come back soon: {id, after}
let sessionTick = 0;
let recent = [];
function pickNext(pool) {
  sessionTick++;
  const allowed = new Set(pool);
  // 1) missed words come back after a few questions
  const qi = sessionQueue.findIndex(q => q.after <= sessionTick && allowed.has(q.id));
  if (qi >= 0) { const id = sessionQueue[qi].id; sessionQueue.splice(qi, 1); return remember(id); }
  const now = Date.now();
  const seen = pool.filter(id => S.cards[id] && !recent.includes(id));
  const due = seen.filter(id => card(id).due <= now).sort((a, b) => card(a).box - card(b).box || card(a).due - card(b).due);
  const unseen = pool.filter(id => !S.cards[id] && !recent.includes(id));
  // mostly due reviews, sprinkle in new words (~35% when reviews are waiting)
  if (due.length && (!unseen.length || Math.random() < 0.65)) return remember(due[rand(Math.min(3, due.length))]);
  if (unseen.length) return remember(unseen[rand(Math.min(25, unseen.length))]);
  // everything seen & not due: take the soonest-due / weakest
  const rest = (seen.length ? seen : pool.filter(id => !recent.includes(id))).slice().sort((a, b) => card(a).due - card(b).due);
  return remember(rest.length ? rest[rand(Math.min(5, rest.length))] : pool[rand(pool.length)]);
}
function remember(id) { recent.push(id); if (recent.length > 4) recent.shift(); return id; }
function requeue(id) { if (!sessionQueue.some(q => q.id === id)) sessionQueue.push({ id, after: sessionTick + 3 + rand(2) }); }

/* ================= XP / levels / streak ================= */
const xpForLevel = L => 50 * L * (L - 1); // total XP needed to reach level L
function levelOf(xp) { let L = 1; while (xp >= xpForLevel(L + 1)) L++; return L; }
function touchStreak() {
  const t = todayStr();
  if (S.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  S.streak = (S.lastDay === todayStr(y)) ? S.streak + 1 : 1;
  S.lastDay = t;
  if (S.streak > 1) toast(`🔥 ${S.streak}-day streak!`);
}
function addXP(n, el) {
  const before = levelOf(S.xp);
  S.xp += n; save();
  if (el) floatText("+" + n + " XP", el);
  const after = levelOf(S.xp);
  if (after > before) { sfx.level(); confetti(160); toast(`⭐ Level up! Lv ${after}`); }
  updateHeader();
}
function currentStreak() { // streak shown is 0 if broken
  if (!S.lastDay) return 0;
  const y = new Date(); y.setDate(y.getDate() - 1);
  return (S.lastDay === todayStr() || S.lastDay === todayStr(y)) ? S.streak : 0;
}
function updateHeader() {
  const L = levelOf(S.xp), lo = xpForLevel(L), hi = xpForLevel(L + 1);
  $("#sLevel").textContent = L;
  $("#sStreak").textContent = currentStreak();
  $("#sMastered").textContent = masteredCount();
  $("#sTotal").textContent = WORDS.length;
  $("#xpText").textContent = S.xp + " XP";
  $("#xpNext").textContent = (hi - S.xp) + " XP to Lv " + (L + 1);
  $("#xpFill").style.width = ((S.xp - lo) / (hi - lo) * 100) + "%";
  $("#soundBtn").textContent = S.sound ? "🔊" : "🔇";
}

/* ================= Combo ================= */
let combo = 0;
const multiplier = () => Math.min(4, 1 + Math.floor(combo / 5) * 0.5);
function comboHit(correct, el, base = 10) {
  if (correct) {
    combo++;
    const gain = Math.round(base * multiplier());
    addXP(gain, el);
    if (combo % 5 === 0) { confetti(combo >= 15 ? 140 : 80); sfx.combo(); toast(`🎉 ${combo} combo! x${multiplier()}`); }
    else sfx.good();
  } else { combo = 0; sfx.bad(); }
  const c = $("#combo"); if (c) { c.textContent = combo ? `🔥 ${combo} · x${multiplier()}` : ""; c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
}

/* ================= Sound (WebAudio) ================= */
let actx = null;
function tone(freq, dur = 0.12, type = "sine", when = 0, vol = 0.18) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  good: () => { tone(660, .1, "triangle"); tone(990, .14, "triangle", .08); },
  bad: () => { tone(220, .18, "sawtooth", 0, .08); tone(160, .22, "sawtooth", .1, .08); },
  combo: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .12, "square", i * .07, .08)),
  level: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .18, "triangle", i * .1)),
  click: () => tone(880, .04, "square", 0, .05),
  tick: () => tone(1200, .03, "square", 0, .04),
  end: () => [784, 659, 523].forEach((f, i) => tone(f, .2, "triangle", i * .12))
};

/* ================= Speech synthesis ================= */
let jaVoice = null;
function loadVoices() { if (!("speechSynthesis" in window)) return; const vs = speechSynthesis.getVoices(); jaVoice = vs.find(v => /^ja[-_]JP/i.test(v.lang)) || vs.find(v => /^ja/i.test(v.lang)) || null; }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const canSpeak = () => "speechSynthesis" in window && S.speech;
function speak(w) {
  if (!canSpeak()) return;
  try {
    const text = w.kana.split(/[;；]/)[0].replace(/[～〜~]/g, "").replace(/\(.*?\)/g, "").trim();
    const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; if (jaVoice) u.voice = jaVoice; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ================= Effects ================= */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], confRunning = false;
function resizeCv() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resizeCv); resizeCv();
function confetti(n = 100) {
  const cols = ["#ff5a7a", "#ffc857", "#2ec4b6", "#7bd88f", "#a78bfa", "#fff"];
  for (let i = 0; i < n; i++) parts.push({ x: cv.width / 2 + (Math.random() - .5) * cv.width * .3, y: cv.height * .35, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 4) * devicePixelRatio, s: (4 + Math.random() * 6) * devicePixelRatio, c: cols[rand(cols.length)], r: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 120 + rand(60) });
  if (!confRunning) { confRunning = true; requestAnimationFrame(stepConf); }
}
function stepConf() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life-- > 0 && p.y < cv.height + 20);
  for (const p of parts) { p.vy += .45 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); }
  if (parts.length) requestAnimationFrame(stepConf); else { confRunning = false; cx.clearRect(0, 0, cv.width, cv.height); }
}
function floatText(t, el) { const r = el.getBoundingClientRect(), d = document.createElement("div"); d.className = "floatxp"; d.textContent = t; d.style.left = (r.left + r.width / 2 - 30) + "px"; d.style.top = (r.top - 10) + "px"; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
let toastT; function toast(t) { document.querySelectorAll(".toast").forEach(e => e.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 1800); }

/* ================= Question building ================= */
const firstMeaning = s => s;
function distractors(w, n, keyFn, pool = WORDS.map(x => x.id)) {
  const used = new Set([keyFn(w)]), out = [];
  // prefer similar-length options for difficulty
  const cands = shuffle(pool).map(id => WORDS[id]);
  const L = keyFn(w).length;
  cands.sort((a, b) => Math.abs(keyFn(a).length - L) - Math.abs(keyFn(b).length - L) + (Math.random() - .5) * 6);
  for (const c of cands) { const k = keyFn(c); if (c.id !== w.id && !used.has(k)) { used.add(k); out.push(c); if (out.length >= n) break; } }
  return out;
}
const romajiLine = w => S.romaji ? `<div class="sub">${esc(ROMA(w.kana))}</div>` : "";

/* ================= Views ================= */
let cleanup = null;
function go(fn) { if (cleanup) { cleanup(); cleanup = null; } combo = 0; sessionQueue = []; recent = []; window.scrollTo(0, 0); fn(); updateHeader(); }

        <circle cx="50" cy="50" r="40" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="${pct > 0 ? "round" : "butt"}" stroke-dasharray="${C * pct} ${C}" transform="rotate(-90 50 50)"/>
        <defs><linearGradient id="g"><stop offset="0" stop-color="#2ec4b6"/><stop offset="1" stop-color="#7bd88f"/></linearGradient></defs>

  const map = $("#map"), frag = document.createDocumentFragment();

function topbar(title, extra = "") {

}
function bindBack() { $("#backBtn").onclick = () => { sfx.click(); go(home); }; }

/* ---------- Multiple-choice quiz (meaning / reverse / reading) ---------- */
function renderMC(mode, w, onAnswer, opts = {}) {
  let opt, prompt, promptCls = "jp", sub = "", qtype, key, choiceCls = "", label;
  if (mode === "meaning") {
    qtype = "What does this mean?"; prompt = w.jp; sub = (w.hasKanji ? `<div class="sub jp">${esc(w.kana)}</div>` : "") + romajiLine(w);
    key = x => x.en; label = x => esc(x.en);
  } else if (mode === "reverse") {
    qtype = "Which Japanese word means…"; prompt = w.en; promptCls = "en";
    key = x => x.jp; choiceCls = "jpc jp"; label = x => `${esc(x.jp)}${x.hasKanji ? `<small>${esc(x.kana)}</small>` : ""}${S.romaji ? `<small>${esc(ROMA(x.kana))}</small>` : ""}`;
  } else {
    qtype = "How do you read this?"; prompt = w.jp; sub = `<div class="sub">${esc(w.en)}</div>`;
    key = x => x.kana; choiceCls = "jpc jp"; label = x => `${esc(x.kana)}${S.romaji ? `<small>${esc(ROMA(x.kana))}</small>` : ""}`;
  }
  opt = shuffle([w, ...distractors(w, 3, key, mode === "reading" ? KANJI_IDS : undefined)]);
  const host = opts.host || $("#qhost");
  host.innerHTML = `<div class="card"><div class="qtype">${qtype}</div>
    ${canSpeak() && mode !== "reverse" ? `<button class="iconbtn" id="spk" title="Listen">🔈</button>` : ""}
    <div class="prompt ${promptCls}">${esc(prompt)}</div>${sub}
    <div class="choices">${opt.map((o, i) => `<button class="choice ${choiceCls}" data-i="${i}"><span class="k">${i + 1}</span>${label(o)}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div></div>`;
  const spk = host.querySelector("#spk"); if (spk) spk.onclick = () => speak(w);
  if (S.autoSpeak && mode !== "reverse") speak(w);
  let done = false;
  const btns = [...host.querySelectorAll(".choice")];
  const choose = i => {
    if (done) return; done = true;
    const ok = opt[i].id === w.id || key(opt[i]) === key(w);
    btns.forEach((b, j) => { b.disabled = true; if (opt[j].id === w.id) b.classList.add("right"); });
    if (!ok) btns[i].classList.add("wrong");
    const fb = host.querySelector("#fb");
    fb.innerHTML = ok ? `<span style="color:var(--good)">✔ ${esc(w.jp)}${w.hasKanji ? "（" + esc(w.kana) + "）" : ""} = ${esc(w.en)}</span>`
                      : `<span style="color:var(--bad)">✘ ${esc(w.jp)}${w.hasKanji ? "（" + esc(w.kana) + "）" : ""} = ${esc(w.en)}</span>`;
    if (mode === "reverse" && canSpeak()) speak(w);
    onAnswer(ok, btns[i]);
  };
  btns.forEach((b, i) => b.onclick = () => choose(i));
  return choose;
}

function quiz(mode) {
  const titles = { meaning: "🈁 Meaning Quiz", reverse: "🔄 Reverse Quiz", reading: "📖 Reading Quiz" };
  const pool = mode === "reading" ? KANJI_IDS : WORDS.map(w => w.id);
  let right = 0, total = 0, choose = null, advancing = null;
  view.innerHTML = topbar(titles[mode], `<span class="muted" id="score">0/0</span>`) + `<div id="qhost"></div><p class="muted" style="text-align:center;font-size:.8rem">Keys <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>Enter</kbd>/<kbd>Space</kbd> for next</p>`;
  bindBack();
  const next = () => {
    clearTimeout(advancing); advancing = null;
    const w = WORDS[pickNext(pool)];
    choose = renderMC(mode, w, (ok, el) => {
      total++; if (ok) right++;
      grade(w.id, ok); if (!ok) requeue(w.id);
      comboHit(ok, el);
      $("#score").textContent = `${right}/${total}`;
      const fb = $("#fb"); const nb = document.createElement("div"); nb.innerHTML = `<button class="btn" id="nextBtn" style="margin-top:10px">Next →</button>`; fb.appendChild(nb);
      $("#nextBtn").onclick = next;
      advancing = setTimeout(next, ok ? 1100 : 2600);
      choose = null;
    });
  };
  const onKey = e => {
    if (document.querySelector(".modal")) return;
    if (choose && /^[1-4]$/.test(e.key)) choose(+e.key - 1);
    else if (!choose && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
  };
  addEventListener("keydown", onKey);
  cleanup = () => { removeEventListener("keydown", onKey); clearTimeout(advancing); };
  next();
}

/* ---------- Speed round ---------- */
function speed() {
  const DUR = 60;
  view.innerHTML = topbar("⚡ Speed Round", `<span class="timer" id="tleft">${DUR}</span>`) +
    `<div class="topbar"><div class="timebar"><div id="tbar" style="width:100%"></div></div><b id="sscore">0 pts</b></div>
     <div id="qhost"><div class="card"><div class="prompt en">Ready?</div><p class="sub">Answer as many JP → EN questions as you can in ${DUR} seconds.<br>Correct: +1 · Wrong: −2 s</p><button class="btn" id="startBtn">Start!</button></div></div>`;
  bindBack();
  let t0, timer, choose = null, score = 0, wrongs = 0, penalty = 0, over = false, lastTick = DUR;
  const pool = WORDS.map(w => w.id);
  const remaining = () => Math.max(0, DUR - (Date.now() - t0) / 1000 - penalty);
  const next = () => {
    if (over) return;
    const w = WORDS[pickNext(pool)];
    choose = renderMC("meaning", w, (ok, el) => {
      grade(w.id, ok);
      if (ok) score++; else { wrongs++; penalty += 2; requeue(w.id); }
      comboHit(ok, el, 8);
      $("#sscore").textContent = score + " pts";
      choose = null;
      setTimeout(next, ok ? 350 : 1100);
    });
  };
  const end = () => {
    over = true; clearInterval(timer); choose = null; sfx.end();
    const best = score > S.bestSpeed; if (best) { S.bestSpeed = score; save(); confetti(200); }
    addXP(score * 2);
    $("#qhost").innerHTML = `<div class="card"><div class="qtype">Time's up!</div><div class="big">${score}</div><p>correct · ${wrongs} wrong${best ? " · <b>🏆 New best!</b>" : ` · best ${S.bestSpeed}`}</p><p class="sub">Bonus +${score * 2} XP</p><button class="btn" id="again">Play again</button></div>`;
    $("#again").onclick = () => go(speed);
  };
  $("#startBtn").onclick = () => {
    t0 = Date.now(); next();
    timer = setInterval(() => {
      const r = remaining(); $("#tleft").textContent = Math.ceil(r); $("#tbar").style.width = (r / DUR * 100) + "%";
      if (r <= 5 && Math.ceil(r) !== lastTick) { lastTick = Math.ceil(r); sfx.tick(); }
      if (r <= 0) end();
    }, 100);
  };
  const onKey = e => { if (choose && /^[1-4]$/.test(e.key)) choose(+e.key - 1); };
  addEventListener("keydown", onKey);
  cleanup = () => { clearInterval(timer); over = true; removeEventListener("keydown", onKey); };
}

/* ---------- Matching pairs ---------- */
function match() {
  const N = 6;
  let round = 0, t0 = Date.now(), misses = 0, sel = null, left = N, timer;
  view.innerHTML = topbar("🧩 Matching Pairs", `<span class="muted" id="mtime">0s</span>`) + `<p class="muted" style="margin:0 0 10px">Tap a Japanese word, then its meaning. Best: ${S.bestMatch ? S.bestMatch + "s" : "—"}</p><div class="match" id="mgrid"></div>`;
  bindBack();
  timer = setInterval(() => { const m = $("#mtime"); if (m) m.textContent = Math.floor((Date.now() - t0) / 1000) + "s"; }, 250);
  cleanup = () => clearInterval(timer);
  // choose words: prefer due / new ones via SRS picker, unique meanings
  const ids = []; const ens = new Set(); let guard = 0;
  while (ids.length < N && guard++ < 200) { const id = pickNext(WORDS.map(w => w.id)); if (!ids.includes(id) && !ens.has(WORDS[id].en)) { ids.push(id); ens.add(WORDS[id].en); } }
  const jpSide = shuffle(ids), enSide = shuffle(ids);
  const grid = $("#mgrid");
  // two columns: JP left, EN right
  for (let i = 0; i < N; i++) {
    const a = WORDS[jpSide[i]], b = WORDS[enSide[i]];
    grid.insertAdjacentHTML("beforeend", `<button class="tile jpt jp" data-id="${a.id}" data-side="jp">${esc(a.jp)}${S.romaji ? `<div style="font-size:.75rem;color:#777;font-family:system-ui">${esc(ROMA(a.kana))}</div>` : ""}</button><button class="tile" data-id="${b.id}" data-side="en">${esc(b.en)}</button>`);
  }
  const missed = new Set();
  grid.onclick = e => {
    const t = e.target.closest(".tile"); if (!t || t.classList.contains("done")) return;
    if (t.dataset.side === "jp") speak(WORDS[+t.dataset.id]);
    if (!sel) { sel = t; t.classList.add("sel"); sfx.click(); return; }
    if (sel === t) { t.classList.remove("sel"); sel = null; return; }
    if (sel.dataset.side === t.dataset.side) { sel.classList.remove("sel"); sel = t; t.classList.add("sel"); sfx.click(); return; }
    const ok = sel.dataset.id === t.dataset.id;
    const a = sel, b = t; sel = null; a.classList.remove("sel");
    if (ok) {
      const id = +a.dataset.id;
      grade(id, !missed.has(id));
      comboHit(true, b, 12);
      a.classList.add("done"); b.classList.add("done"); left--;
      if (left === 0) finish();
    } else {
      misses++; comboHit(false);
      [a, b].forEach(x => { x.classList.add("bad"); setTimeout(() => x.classList.remove("bad"), 400); });
      const jpId = +(a.dataset.side === "jp" ? a : b).dataset.id;
      missed.add(jpId);
    }
  };
  function finish() {
    clearInterval(timer);
    const secs = Math.round((Date.now() - t0) / 1000);
    const perfect = misses === 0;
    const best = !S.bestMatch || secs < S.bestMatch; if (best) { S.bestMatch = secs; save(); }
    if (perfect) confetti(150);
    const bonus = perfect ? 30 : 10; addXP(bonus);
    grid.innerHTML = `<div class="card" style="grid-column:1/-1"><div class="qtype">Board cleared!</div><div class="big">${secs}s</div><p>${misses} miss${misses === 1 ? "" : "es"}${perfect ? " · ✨ Perfect!" : ""}${best ? " · 🏆 New best time" : ""}</p><p class="sub">+${bonus} XP bonus</p><button class="btn" id="again">Next board</button></div>`;
    $("#again").onclick = () => go(match);
  }
}

/* ---------- Browse ---------- */
function browse() {
  view.innerHTML = topbar("🗂️ Word List", `<span class="muted">${WORDS.length} words</span>`) + `<input id="q" placeholder="Search Japanese, kana, romaji or English…" style="width:100%;padding:12px;border-radius:12px;border:none;font-size:1rem;margin-bottom:10px"><div class="panel" id="list" style="margin-top:0"></div>`;
  bindBack();
  const list = $("#list");
  const render = q => {
    q = q.trim().toLowerCase();
    const rows = WORDS.filter(w => !q || w.jp.includes(q) || w.kana.includes(q) || w.en.toLowerCase().includes(q) || ROMA(w.kana).includes(q)).slice(0, 800);
    list.innerHTML = rows.map(w => `<div class="row" data-id="${w.id}" style="cursor:pointer"><span><i class="b${Math.min(5, card(w.id).box === 6 ? 5 : card(w.id).box)}" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px"></i><b class="jp" style="font-size:1.3rem">${esc(w.jp)}</b> <span class="muted jp">${w.hasKanji ? esc(w.kana) : ""}</span>${S.romaji ? ` <span class="muted" style="font-size:.8rem">${esc(ROMA(w.kana))}</span>` : ""}</span><span style="text-align:right;font-size:.9rem">${esc(w.en)}</span></div>`).join("") || `<p class="muted">No matches.</p>`;
  };
  $("#q").oninput = e => render(e.target.value);
  list.onclick = e => { const r = e.target.closest(".row"); if (r) wordModal(WORDS[+r.dataset.id]); };
  render("");
}

/* ---------- Settings ---------- */
function settings() {
  const md = document.createElement("div"); md.className = "modal";
  const sw = (k, label, desc) => `<div class="row"><span style="text-align:left">${label}<br><small class="muted">${desc}</small></span><button class="switch ${S[k] ? "on" : ""}" data-k="${k}" aria-label="${label}"></button></div>`;
  md.innerHTML = `<div class="box" style="text-align:left"><h2 style="margin-top:0">⚙️ Settings</h2>
    ${sw("sound", "🔊 Sound effects", "WebAudio beeps & fanfares")}
    ${sw("romaji", "🔤 Romaji hints", "Show romaji generated from kana")}
    ${sw("speech", "🗣️ Pronunciation", "speechSynthesis" in window ? (jaVoice ? "Japanese voice: " + esc(jaVoice.name) : "Uses ja-JP voice if your device has one") : "Not supported in this browser")}
    ${sw("autoSpeak", "▶️ Auto-play audio", "Speak each Japanese prompt automatically")}
    <div class="row"><span>🗑️ Reset all progress<br><small class="muted">Clears SRS boxes, XP, streak, bests</small></span><button class="btn small" id="resetBtn" style="background:var(--bad)">Reset</button></div>
    <div style="text-align:right;margin-top:12px"><button class="btn" id="closeS">Done</button></div></div>`;
  document.body.appendChild(md);
  md.querySelectorAll(".switch").forEach(b => b.onclick = () => { const k = b.dataset.k; S[k] = !S[k]; b.classList.toggle("on", S[k]); save(); updateHeader(); if (k === "sound" && S.sound) sfx.good(); });
  md.querySelector("#resetBtn").onclick = () => {
    if (confirm("Really reset ALL progress? This cannot be undone.")) { const keep = { sound: S.sound, romaji: S.romaji, speech: S.speech, autoSpeak: S.autoSpeak }; S = Object.assign(defaultState(), keep); save(); md.remove(); toast("Progress reset"); go(home); }
  };
  md.onclick = e => { if (e.target === md || e.target.id === "closeS") { md.remove(); go(home); } };
}

/* ================= Boot ================= */
$("#homeLogo").onclick = () => go(home);
$("#settingsBtn").onclick = () => { sfx.click(); settings(); };
$("#soundBtn").onclick = () => { S.sound = !S.sound; save(); updateHeader(); if (S.sound) sfx.good(); };
$("#srcInfo").innerHTML = `${WORDS.length} JLPT N5 words from <a href="${esc(SOURCE_URL)}" target="_blank" rel="noopener">open-anki-jlpt-decks</a>`;
window.__N5 = { WORDS, ROMA, S: () => S }; // handy for debugging/tests
go(home);
</script>
