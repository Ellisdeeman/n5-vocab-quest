      { k: "p", s: "コーヒー ＿ のみませんか。", a: "を", o: ["を", "で", "へ", "に"], en: "Would you like to drink some coffee?" },
      { k: "p", s: "ともだちに てがみ ＿ かきました。", a: "を", o: ["を", "が", "へ", "で"], en: "I wrote a letter to my friend." },
      { k: "o", t: ["まいあさ", "しんぶんを", "よみます"], alt: [["しんぶんを", "まいあさ", "よみます"]], en: "I read the newspaper every morning." }] },
{ id: "ni", cat: "Particles", t: "に — time, destination, location, person", p: "Time に / Place に / Person に",
  l: ["に points at a <b>target</b>. Four N5 uses:",
      "• <b>A specific time</b>: しちじ<b>に</b> おきます. Used with clock times, dates and days of the week — but not with きょう, あした, まいにち.<br>• <b>Destination</b>: がっこう<b>に</b> いきます.<br>• <b>Where something is</b> (with ある／いる): へや<b>に</b> ねこが います.<br>• <b>The person</b> you meet, give to or phone: ともだち<b>に</b> あいます."],
  ex: [["六時に起きます。", "ろくじに おきます。", "I get up at six."], ["来年、日本に行きます。", "らいねん、にほんに いきます。", "I'm going to Japan next year."], ["机の上に本があります。", "つくえの うえに ほんが あります。", "There is a book on the desk."]],
  d: [{ k: "p", s: "まいあさ しちじ ＿ おきます。", a: "に", o: ["に", "で", "を", "と"], en: "I get up at seven every morning." },
      { k: "p", s: "こうえんの まえ ＿ ぎんこうが あります。", a: "に", o: ["に", "で", "を", "へ"], en: "There's a bank in front of the park." },
      { k: "p", s: "きのう ともだち ＿ あいました。", a: "に", o: ["に", "を", "で", "が"], en: "I met a friend yesterday." },
      { k: "p", s: "らいしゅう おおさか ＿ いきます。", a: "に", o: ["に", "で", "を", "が"], en: "I'm going to Osaka next week." }] },
{ id: "de", cat: "Particles", t: "で — place of action, means", p: "Place で Verb / Tool で Verb",
  l: ["で marks <b>where an action happens</b>: としょかん<b>で</b> べんきょうします (I study at the library).",
      "It also marks <b>how / with what</b>: バス<b>で</b> いきます (by bus), はし<b>で</b> たべます (with chopsticks), にほんご<b>で</b> はなします (in Japanese).",
      "Compare: へや<b>に</b> います (being somewhere → に) but へや<b>で</b> べんきょうします (doing something somewhere → で)."],
  ex: [["図書館で勉強します。", "としょかんで べんきょうします。", "I study at the library."], ["バスで学校へ行きます。", "バスで がっこうへ いきます。", "I go to school by bus."], ["日本語で話しましょう。", "にほんごで はなしましょう。", "Let's talk in Japanese."]],
  d: [{ k: "p", s: "レストラン ＿ ばんごはんを たべました。", a: "で", o: ["で", "に", "を", "が"], en: "I ate dinner at a restaurant." },
      { k: "p", s: "でんしゃ ＿ かいしゃに いきます。", a: "で", o: ["で", "を", "に", "が"], en: "I go to the office by train." },
      { k: "p", s: "えんぴつ ＿ なまえを かいて ください。", a: "で", o: ["で", "に", "を", "が"], en: "Please write your name in pencil." },
      { k: "p", s: "こうえん ＿ こどもが あそんで います。", a: "で", o: ["で", "に", "を", "へ"], en: "Children are playing in the park." }] },
{ id: "he", cat: "Particles", t: "へ — direction", p: "Place へ いく／くる／かえる",
  l: ["へ marks the <b>direction</b> of movement and is pronounced <b>e</b>. It goes with いく, くる and かえる.",
      "For destinations へ and に are usually interchangeable: がっこう<b>へ</b>／がっこう<b>に</b> いきます. But only に is used for times and for where something is."],
  ex: [["明日、京都へ行きます。", "あした、きょうとへ いきます。", "I'll go to Kyoto tomorrow."], ["何時に家へ帰りますか。", "なんじに うちへ かえりますか。", "What time do you go home?"]],
  d: [{ k: "p", s: "らいげつ アメリカ ＿ いきます。", a: "へ", o: ["へ", "を", "で", "が"], en: "I'm going to America next month." },
      { k: "p", s: "なんじに うち ＿ かえりますか。", a: "へ", o: ["へ", "で", "を", "が"], en: "What time will you go home?" },
      { k: "m", q: "How is the particle へ pronounced?", a: "e", o: ["e", "he", "ni", "wa"] },
      { k: "p", s: "しちじ ＿ うちを でます。", a: "に", o: ["に", "へ", "を", "が"], en: "I leave home at seven. (time → に, never へ)" }] },
{ id: "to", cat: "Particles", t: "と — and / with", p: "A と B · Person と",
  l: ["と has two jobs:",
      "• <b>“and”</b> between nouns, naming <i>all</i> the items: パン<b>と</b> たまご (bread and eggs).<br>• <b>“with”</b> a person: ともだち<b>と</b> えいがを みます. Add いっしょに for “together”: かぞく<b>と</b> いっしょに.",
      "と joins nouns only — it never joins verbs or whole sentences."],
  ex: [["パンと卵を食べました。", "パンと たまごを たべました。", "I ate bread and eggs."], ["友達と映画を見ます。", "ともだちと えいがを みます。", "I'll watch a movie with a friend."], ["家族と一緒に住んでいます。", "かぞくと いっしょに すんで います。", "I live with my family."]],
  d: [{ k: "p", s: "ペン ＿ ノートを かいました。", a: "と", o: ["と", "を", "が", "へ"], en: "I bought a pen and a notebook." },
      { k: "p", s: "にちようびに ともだち ＿ えいがを みました。", a: "と", o: ["と", "を", "で", "へ"], en: "I watched a movie with a friend on Sunday." },
      { k: "o", t: ["かぞくと", "いっしょに", "ごはんを", "たべます"], alt: [["ごはんを", "かぞくと", "いっしょに", "たべます"]], en: "I eat with my family." }] },
{ id: "mo", cat: "Particles", t: "も — also, too", p: "X も ～",
  l: ["も means <b>“too / also”</b>. It <b>replaces</b> は, が and を — never write はも or をも: わたし<b>も</b> がくせいです (I'm a student too).",
      "With other particles, も is added after them: ここ<b>にも</b> (here too), ともだち<b>とも</b> (with a friend too).",
      "<b>A も B も</b> = “both A and B”; with a negative verb, “neither … nor …” / “not … either”: わたし<b>も</b> いきません (I'm not going either)."],
  ex: [["私も学生です。", "わたしも がくせいです。", "I'm a student too."], ["肉も魚も好きです。", "にくも さかなも すきです。", "I like both meat and fish."], ["弟もテレビを見ません。", "おとうとも テレビを みません。", "My younger brother doesn't watch TV either."]],
  d: [{ k: "p", s: "たなかさんは がくせいです。わたし ＿ がくせいです。", a: "も", o: ["も", "を", "に", "で"], en: "Tanaka-san is a student. I'm a student too." },
      { k: "p", s: "にくも さかな ＿ たべます。", a: "も", o: ["も", "で", "へ", "に"], en: "I eat both meat and fish." },
      { k: "m", q: "“I drink coffee too.”", a: "コーヒーも のみます。", o: ["コーヒーも のみます。", "コーヒーをも のみます。", "コーヒーもを のみます。", "コーヒーにも のみます。"] }] },
{ id: "no", cat: "Particles", t: "の — of, ’s", p: "A の B",
  l: ["の links two nouns: <b>A の B</b> = “A's B” or “B of / for / about A”. The main noun is the <b>second</b> one: わたし<b>の</b> ほん (my book), にほんご<b>の</b> せんせい (a Japanese teacher), つくえ<b>の</b> うえ (the top of the desk).",
      "If the second noun is clear, it can be dropped: これは わたし<b>の</b>です (This is mine)."],
  ex: [["これは私の傘です。", "これは わたしの かさです。", "This is my umbrella."], ["日本語の先生はとても面白いです。", "にほんごの せんせいは とても おもしろいです。", "The Japanese teacher is really interesting."], ["その本は友達のです。", "その ほんは ともだちのです。", "That book is my friend's."]],
  d: [{ k: "p", s: "これは わたし ＿ かばんです。", a: "の", o: ["の", "と", "を", "で"], en: "This is my bag." },
      { k: "p", s: "にほんご ＿ ほんを かいました。", a: "の", o: ["の", "を", "が", "へ"], en: "I bought a Japanese book." },
      { k: "p", s: "ねこは つくえ ＿ したに います。", a: "の", o: ["の", "に", "で", "を"], en: "The cat is under the desk." },
      { k: "o", t: ["それは", "ともだちの", "かさです"], en: "That is my friend's umbrella." }] },
{ id: "ka", cat: "Particles", t: "か — questions, “or”", p: "～か。 / A か B",
  l: ["Put か at the end of a sentence to make a <b>question</b> — the word order does not change: がくせいです → がくせいです<b>か</b>. A written question usually ends with か。 rather than a question mark.",
      "Between nouns, か means <b>“or”</b>: コーヒー<b>か</b> こうちゃ.",
      "Short answers: はい、そうです／いいえ、ちがいます (to “Is it X?”) and はい、たべます／いいえ、たべません (to verb questions)."],
  ex: [["あなたは学生ですか。", "あなたは がくせいですか。", "Are you a student?"], ["これは何ですか。", "これは なんですか。", "What is this?"], ["コーヒーか紅茶を飲みます。", "コーヒーか こうちゃを のみます。", "I'll drink coffee or black tea."]],
  d: [{ k: "p", s: "これは なんです ＿。", a: "か", o: ["か", "よ", "ね", "の"], en: "What is this?" },
      { k: "p", s: "あしたは バス ＿ でんしゃで いきます。", a: "か", o: ["か", "を", "が", "は"], en: "Tomorrow I'll go by bus or train." },
      { k: "m", q: "あなたは せんせいですか。 — “No, I'm not.”", a: "いいえ、ちがいます。", o: ["いいえ、ちがいます。", "はい、そうです。", "いいえ、そうです。", "はい、ちがいます。"] }] },
{ id: "yone", cat: "Particles", t: "よ・ね — sentence endings", p: "～よ。 / ～ね。",
  l: ["These endings add feeling:",
      "• <b>よ</b> tells the listener something new or stresses it — “…, you know!”: この みせ、やすいです<b>よ</b>.<br>• <b>ね</b> looks for or shows agreement — “…, isn't it? / right?”: きょうは さむいです<b>ね</b>.<br>• <b>よね</b> = “…, right?” when you are fairly sure."],
  ex: [["今日は暑いですね。", "きょうは あついですね。", "It's hot today, isn't it?"], ["あの店は安いですよ。", "あの みせは やすいですよ。", "That shop is cheap, you know."], ["明日はテストですよね。", "あしたは テストですよね。", "Tomorrow's the test, right?"]],
  d: [{ k: "p", s: "A：きょうは いい てんきです ＿。　B：ええ、そうですね。", a: "ね", o: ["ね", "よ", "か", "を"], en: "A: Nice weather today, isn't it? B: Yes, it is." },
      { k: "p", s: "（telling a friend the news）あした テストが あります ＿。", a: "よ", o: ["よ", "ね", "か", "を"], en: "There's a test tomorrow, you know!" },
      { k: "m", q: "You want your friend to agree that the movie was fun. Which fits?", a: "たのしかったですね。", o: ["たのしかったですね。", "たのしかったですよ。", "たのしかったですか。"] }] },
{ id: "ya", cat: "Particles", t: "や — and (among others)", p: "A や B（など）",
  l: ["や lists <b>examples</b>: “A, B and so on”. Unlike と, the list is not complete. It is often closed with など (etc.): ほん<b>や</b> ペン<b>など</b>."],
  ex: [["机の上に本やペンがあります。", "つくえの うえに ほんや ペンが あります。", "There are books, pens and so on on the desk."], ["パンや卵などを買いました。", "パンや たまごなどを かいました。", "I bought bread, eggs and other things."]],
  d: [{ k: "p", s: "かばんの なかに ほん ＿ ノートなどが あります。", a: "や", o: ["や", "を", "で", "に"], en: "In the bag there are books, notebooks and so on." },
      { k: "m", q: "Which says the list is complete (only these two things)?", a: "パンと たまご", o: ["パンと たまご", "パンや たまご"] }] },
{ id: "kara", cat: "Particles", t: "から・まで — from, until", p: "A から B まで",
  l: ["<b>から</b> = “from” (starting point) and <b>まで</b> = “until / as far as” (end point). Both work for time and place: くじ<b>から</b> ごじ<b>まで</b>, うち<b>から</b> えき<b>まで</b>.",
      "They can end a sentence with です: ぎんこうは さんじ<b>まで</b>です (The bank is open until three)."],
  ex: [["仕事は九時から五時までです。", "しごとは くじから ごじまでです。", "I work from nine to five."], ["家から駅まで歩きます。", "うちから えきまで あるきます。", "I walk from home to the station."]],
  d: [{ k: "p", s: "ぎんこうは くじ ＿ さんじまでです。", a: "から", o: ["から", "まで", "に", "で"], en: "The bank is open from nine to three." },
      { k: "p", s: "えきから がっこう ＿ あるきます。", a: "まで", o: ["まで", "から", "が", "は"], en: "I walk from the station to school." },
      { k: "o", t: ["うちから", "えきまで", "じてんしゃで", "いきます"], alt: [["じてんしゃで", "うちから", "えきまで", "いきます"]], en: "I go from home to the station by bicycle." }] },
/* ---------- Nouns & です ---------- */
{ id: "desu", cat: "Nouns & です", t: "です・ではありません", p: "N です / N ではありません",
  l: ["<b>です</b> is the polite “is / am / are” after a noun: がくせい<b>です</b>.",
      "Negative: <b>ではありません</b>. In everyday speech you will also hear <b>じゃありません</b> and <b>じゃないです</b> — all mean “is not”."],
  ex: [["私は日本人ではありません。", "わたしは にほんじんでは ありません。", "I am not Japanese."], ["今日は休みです。", "きょうは やすみです。", "Today is a day off."], ["あれは銀行じゃありません。", "あれは ぎんこうじゃ ありません。", "That over there is not a bank."]],
  d: [{ k: "c", q: "がくせいです", f: "negative (polite)", a: ["がくせいではありません", "がくせいじゃありません", "がくせいじゃないです", "がくせいではないです"], en: "is not a student" },
      { k: "c", q: "やすみです", f: "negative (polite)", a: ["やすみではありません", "やすみじゃありません", "やすみじゃないです", "やすみではないです"], en: "is not a day off" },
      { k: "m", q: "“That over there is not a hospital.”", a: "あれは びょういんでは ありません。", o: ["あれは びょういんでは ありません。", "あれは びょういんです。", "あれは びょういんでした。", "あれは びょういんでは ありました。"] }] },
{ id: "deshita", cat: "Nouns & です", t: "でした — was / was not", p: "N でした / N ではありませんでした",
  l: ["The past of です is <b>でした</b> (“was”). The past negative is <b>ではありませんでした</b> (or じゃありませんでした) — “was not”."],
  ex: [["昨日は雨でした。", "きのうは あめでした。", "It was rainy yesterday."], ["先週は休みじゃありませんでした。", "せんしゅうは やすみじゃ ありませんでした。", "Last week was not a holiday."]],
  d: [{ k: "c", q: "あめです", f: "past (polite)", a: ["あめでした"], en: "was rain(y)" },
      { k: "c", q: "やすみです", f: "past negative (polite)", a: ["やすみではありませんでした", "やすみじゃありませんでした", "やすみじゃなかったです", "やすみではなかったです"], en: "was not a day off" },
      { k: "p", s: "きのうは にちようび ＿。", a: "でした", o: ["でした", "です", "ではありません", "でしょう"], en: "Yesterday was Sunday." }] },
{ id: "da", cat: "Nouns & です", t: "だ — plain “is”", p: "N だ / じゃない / だった / じゃなかった",
  l: ["<b>だ</b> is the plain (casual) form of です, used with friends and family and inside longer plain sentences.",
      "Forms: <b>だ</b> (is), <b>じゃない</b> (isn't), <b>だった</b> (was), <b>じゃなかった</b> (wasn't). In casual questions だ is dropped: がくせい？"],
  ex: [["今日は休みだ。", "きょうは やすみだ。", "Today's a day off."], ["あの人は先生じゃない。", "あの ひとは せんせいじゃ ない。", "That person isn't a teacher."], ["昨日は雨だった。", "きのうは あめだった。", "It was rainy yesterday."]],
  d: [{ k: "c", q: "がくせいです", f: "plain (casual)", a: ["がくせいだ"], en: "is a student" },
      { k: "c", q: "あめでした", f: "plain past", a: ["あめだった"], en: "was rain(y)" },
      { k: "c", q: "せんせいではありません", f: "plain negative", a: ["せんせいじゃない", "せんせいではない"], en: "is not a teacher" }] },
/* ---------- Polite verbs ---------- */
{ id: "masu", cat: "Polite verbs", t: "～ます — polite verbs", p: "V-ます",
  l: ["Polite verbs end in <b>ます</b>. The same form covers habits and the future: まいにち コーヒーを のみ<b>ます</b> (I drink coffee every day), あした いき<b>ます</b> (I'll go tomorrow).",
      "The verb comes at the <b>end</b> of a Japanese sentence; time words usually come near the start."],
  ex: [["毎日日本語を勉強します。", "まいにち にほんごを べんきょうします。", "I study Japanese every day."], ["明日、友達が来ます。", "あした、ともだちが きます。", "My friend is coming tomorrow."], ["夜十一時に寝ます。", "よる じゅういちじに ねます。", "I go to bed at eleven at night."]],
  d: [{ k: "c", q: "たべる", f: "polite (ます)", a: ["たべます"], en: "eat" },
      { k: "c", q: "いく", f: "polite (ます)", a: ["いきます"], en: "go" },
      { k: "c", q: "する", f: "polite (ます)", a: ["します"], en: "do" },
      { k: "o", t: ["わたしは", "まいにち", "コーヒーを", "のみます"], alt: [["まいにち", "わたしは", "コーヒーを", "のみます"], ["わたしは", "コーヒーを", "まいにち", "のみます"]], en: "I drink coffee every day." }] },
{ id: "masen", cat: "Polite verbs", t: "～ません — don't / won't", p: "V-ません",
  l: ["For the polite negative, change ます to <b>ません</b>: のみます → のみ<b>ません</b> (don't / won't drink).",
      "Handy with frequency words: <b>あまり</b> ～ません (not much), <b>ぜんぜん</b> ～ません (not at all)."],
  ex: [["私はお酒を飲みません。", "わたしは おさけを のみません。", "I don't drink alcohol."], ["あまりテレビを見ません。", "あまり テレビを みません。", "I don't watch TV much."]],
  d: [{ k: "c", q: "のみます", f: "negative (polite)", a: ["のみません"], en: "don't drink" },
      { k: "c", q: "きます (come)", f: "negative (polite)", a: ["きません"], en: "don't come" },
      { k: "c", q: "わかります", f: "negative (polite)", a: ["わかりません"], en: "don't understand" },
      { k: "m", q: "“I don't eat meat much.”", a: "にくは あまり たべません。", o: ["にくは あまり たべません。", "にくは あまり たべます。", "にくは とても たべません。"] }] },
{ id: "mashita", cat: "Polite verbs", t: "～ました・～ませんでした — past", p: "V-ました / V-ませんでした",
  l: ["Polite past: <b>ました</b> (did). Polite past negative: <b>ませんでした</b> (didn't): きのう えいがを み<b>ました</b>／み<b>ませんでした</b>."],
  ex: [["昨日、映画を見ました。", "きのう、えいがを みました。", "I watched a movie yesterday."], ["今朝は朝ご飯を食べませんでした。", "けさは あさごはんを たべませんでした。", "I didn't eat breakfast this morning."]],
  d: [{ k: "c", q: "かいます", f: "past (polite)", a: ["かいました"], en: "bought" },
      { k: "c", q: "いきます", f: "past negative (polite)", a: ["いきませんでした"], en: "didn't go" },
      { k: "c", q: "べんきょうします", f: "past (polite)", a: ["べんきょうしました"], en: "studied" },
      { k: "o", t: ["きのう", "デパートで", "くつを", "かいました"], alt: [["デパートで", "きのう", "くつを", "かいました"]], en: "I bought shoes at the department store yesterday." }] },
{ id: "mashou", cat: "Polite verbs", t: "～ませんか・～ましょう・～ましょうか", p: "V-ませんか / V-ましょう / V-ましょうか",
  l: ["<b>～ませんか</b> invites politely — “Won't you…? / Would you like to…?”: いっしょに えいがを み<b>ませんか</b>.",
      "<b>～ましょう</b> = “Let's…”, and it is the natural reply to an invitation: ええ、み<b>ましょう</b>.",
      "<b>～ましょうか</b> = “Shall I / shall we…?” — offering help or suggesting: まどを あけ<b>ましょうか</b>."],
  ex: [["一緒に昼ご飯を食べませんか。", "いっしょに ひるごはんを たべませんか。", "Would you like to have lunch together?"], ["ええ、食べましょう。", "ええ、たべましょう。", "Sure, let's eat."], ["窓を開けましょうか。", "まどを あけましょうか。", "Shall I open the window?"]],
  d: [{ k: "c", q: "のみます", f: "let's (ましょう)", a: ["のみましょう"], en: "let's drink" },
      { k: "c", q: "いきます", f: "invitation (ませんか)", a: ["いきませんか"], en: "won't you go?" },
      { k: "m", q: "Offer help: “Shall I carry your bag?”", a: "かばんを もちましょうか。", o: ["かばんを もちましょうか。", "かばんを もちませんか。", "かばんを もちました。"] }] },
/* ---------- Plain verb forms ---------- */
{ id: "dict", cat: "Plain verb forms", t: "Verb groups & dictionary form", p: "V (dictionary form)",
  l: ["The <b>dictionary form</b> is the plain present: たべる, のむ, する. Verbs fall into three groups:",
      "• <b>Group 1 (u-verbs)</b>: most verbs — every ending except -iru / -eru (かう, かく, およぐ, はなす, まつ, あそぶ, よむ), plus a few -iru / -eru exceptions. ます-form: -u → -i + ます: かく → か<b>き</b>ます.<br>• <b>Group 2 (ru-verbs)</b>: end in -iru / -eru; drop る: たべる → たべます, みる → みます. Exceptions that look like Group 2 but are Group 1: かえる (go home), はいる, はしる, しる — かえる → かえります.<br>• <b>Group 3 (irregular)</b>: する → します, くる → きます."],
  ex: [["毎日、本を読む。", "まいにち、ほんを よむ。", "I read books every day. (casual)"], ["明日、学校に行く。", "あした、がっこうに いく。", "I'm going to school tomorrow. (casual)"]],
  d: [{ k: "c", q: "よみます", f: "dictionary form", a: ["よむ"], en: "read" },
      { k: "c", q: "おきます", f: "dictionary form", a: ["おきる"], en: "get up" },
      { k: "c", q: "かえります (go home)", f: "dictionary form", a: ["かえる"], en: "go home" },
      { k: "c", q: "きます (come)", f: "dictionary form", a: ["くる"], en: "come" },
      { k: "c", q: "べんきょうします", f: "dictionary form", a: ["べんきょうする"], en: "study" },
      { k: "m", q: "Which verb is Group 2 (a ru-verb)?", a: "たべる", o: ["たべる", "かえる", "はいる", "のむ"] }] },
{ id: "nai", cat: "Plain verb forms", t: "～ない — plain negative", p: "V-ない",
  l: ["Plain negative (<b>ない-form</b>):",
      "• Group 1: -u → <b>-a + ない</b>: かく → か<b>か</b>ない, のむ → の<b>ま</b>ない. Verbs ending in う use わ: かう → か<b>わ</b>ない.<br>• Group 2: drop る + ない: たべる → たべない.<br>• Irregular: する → <b>しない</b>, くる → <b>こない</b>. Special: ある → <b>ない</b>."],
  ex: [["今日は学校に行かない。", "きょうは がっこうに いかない。", "I'm not going to school today."], ["肉を食べない。", "にくを たべない。", "I don't eat meat."]],
  d: [{ k: "c", q: "のむ", f: "ない-form", a: ["のまない"], en: "not drink" },
      { k: "c", q: "かう", f: "ない-form", a: ["かわない"], en: "not buy" },
      { k: "c", q: "みる", f: "ない-form", a: ["みない"], en: "not see" },
      { k: "c", q: "くる", f: "ない-form", a: ["こない"], en: "not come" },
      { k: "c", q: "ある", f: "ない-form", a: ["ない"], en: "there isn't" },
      { k: "c", q: "はなす", f: "ない-form", a: ["はなさない"], en: "not speak" }] },
{ id: "te", cat: "Plain verb forms", t: "The て-form", p: "V-て",
  l: ["The <b>て-form</b> links actions and builds many patterns. Group 2: drop る + て (たべ<b>て</b>). Irregular: する → <b>して</b>, くる → <b>きて</b>. Group 1 depends on the last kana:",
      "• う・つ・る → <b>って</b>: かう → かって, まつ → まって, かえる → かえって<br>• む・ぶ・ぬ → <b>んで</b>: のむ → のんで, あそぶ → あそんで<br>• く → <b>いて</b> (かく → かいて); ぐ → <b>いで</b> (およぐ → およいで)<br>• す → <b>して</b>: はなす → はなして<br>• Exception: いく → <b>いって</b>",
      "Joining actions in order: あさ おきて、かおを あらって、がっこうへ いきます。"],
  ex: [["朝起きて、顔を洗います。", "あさ おきて、かおを あらいます。", "I get up in the morning and wash my face."], ["デパートへ行って、靴を買いました。", "デパートへ いって、くつを かいました。", "I went to the department store and bought shoes."]],
  d: [{ k: "c", q: "かう", f: "て-form", a: ["かって"], en: "buy" },
      { k: "c", q: "のむ", f: "て-form", a: ["のんで"], en: "drink" },
      { k: "c", q: "かく", f: "て-form", a: ["かいて"], en: "write" },
      { k: "c", q: "いく", f: "て-form", a: ["いって"], en: "go" },
      { k: "c", q: "はなす", f: "て-form", a: ["はなして"], en: "speak" },
      { k: "c", q: "およぐ", f: "て-form", a: ["およいで"], en: "swim" },
      { k: "c", q: "くる", f: "て-form", a: ["きて"], en: "come" },
      { k: "o", t: ["うちへ", "かえって", "しゅくだいを", "しました"], en: "I went home and did my homework." }] },
{ id: "ta", cat: "Plain verb forms", t: "～た — plain past", p: "V-た / V-なかった",
  l: ["The plain past (<b>た-form</b>) is made exactly like the て-form, with た／だ instead of て／で: たべて → たべ<b>た</b>, のんで → のん<b>だ</b>, いって → いっ<b>た</b>.",
      "Plain past negative: ない → <b>なかった</b>: たべなかった (didn't eat)."],
  ex: [["昨日、新しい靴を買った。", "きのう、あたらしい くつを かった。", "I bought new shoes yesterday."], ["今朝、新聞を読まなかった。", "けさ、しんぶんを よまなかった。", "I didn't read the newspaper this morning."]],
  d: [{ k: "c", q: "たべる", f: "た-form (plain past)", a: ["たべた"], en: "ate" },
      { k: "c", q: "のむ", f: "た-form (plain past)", a: ["のんだ"], en: "drank" },

      { k: "c", q: "かく", f: "た-form (plain past)", a: ["かいた"], en: "wrote" },
      { k: "c", q: "みる", f: "plain past negative", a: ["みなかった"], en: "didn't see" },
      { k: "c", q: "する", f: "た-form (plain past)", a: ["した"], en: "did" }] },
/* ---------- Using the て-form ---------- */
{ id: "tekudasai", cat: "Using the て-form", t: "～てください — please do", p: "V-て ください / N を ください",
  l: ["<b>て-form + ください</b> makes a polite request — “Please (do)…”: ここに なまえを かい<b>て ください</b>.",
      "For things, use <b>Noun を ください</b>: みずを ください (Water, please)."],
  ex: [["ちょっと待ってください。", "ちょっと まって ください。", "Please wait a moment."], ["このペンを使ってください。", "この ペンを つかって ください。", "Please use this pen."], ["水をください。", "みずを ください。", "Water, please."]],
  d: [{ k: "c", q: "まつ", f: "please… (てください)", a: ["まってください"], en: "please wait" },
      { k: "c", q: "みる", f: "please… (てください)", a: ["みてください"], en: "please look" },
      { k: "c", q: "すわる", f: "please… (てください)", a: ["すわってください"], en: "please sit" },
      { k: "p", s: "その ノート ＿ ください。", a: "を", o: ["を", "が", "で", "に"], en: "That notebook, please." },
      { k: "o", t: ["ここに", "なまえを", "かいて", "ください"], alt: [["なまえを", "ここに", "かいて", "ください"]], en: "Please write your name here." }] },
{ id: "naide", cat: "Using the て-form", t: "～ないでください — please don't", p: "V-ないで ください",
  l: ["<b>ない-form + で ください</b> = “Please don't…”: ここで しゃしんを とら<b>ないで ください</b>."],
  ex: [["ここで写真を撮らないでください。", "ここで しゃしんを とらないで ください。", "Please don't take photos here."], ["窓を開けないでください。", "まどを あけないで ください。", "Please don't open the window."]],

{ id: "teiru", cat: "Using the て-form", t: "～ています — doing / state", p: "V-て います",
  l: ["<b>て-form + います</b> describes:",
      "• An action <b>in progress</b>: いま テレビを み<b>て います</b> (I'm watching TV now).<br>• A <b>regular activity</b> or job: ぎんこうで はたらい<b>て います</b> (I work at a bank).<br>• A <b>resulting state</b> with verbs like すむ, しる, もつ, けっこんする: とうきょうに すん<b>で います</b> (I live in Tokyo).",
      "In casual speech the い often drops: みてる."],
  ex: [["今、雨が降っています。", "いま、あめが ふって います。", "It's raining now."], ["姉は銀行で働いています。", "あねは ぎんこうで はたらいて います。", "My older sister works at a bank."], ["東京に住んでいます。", "とうきょうに すんで います。", "I live in Tokyo."]],
  d: [{ k: "c", q: "よむ", f: "is …ing (ています)", a: ["よんでいます"], en: "is reading" },
      { k: "c", q: "まつ", f: "is …ing (ています)", a: ["まっています"], en: "is waiting" },
      { k: "c", q: "はたらく", f: "is …ing (ています)", a: ["はたらいています"], en: "is working" },
      { k: "m", q: "“I live in Osaka.” Which is natural?", a: "おおさかに すんで います。", o: ["おおさかに すんで います。", "おおさかに すみます。", "おおさかで すんで います。"] }] },
{ id: "temoii", cat: "Using the て-form", t: "～てもいいです — may", p: "V-ても いいです（か）",
  l: ["<b>て-form + も いいです</b> = “It's OK to… / You may…”. As a question it asks permission: しゃしんを とっ<b>ても いいですか</b> (May I take a photo?).",
      "Answers: ええ、いいですよ (Sure) or すみません、ちょっと… (a polite no)."],
  ex: [["ここに座ってもいいですか。", "ここに すわっても いいですか。", "May I sit here?"], ["鉛筆で書いてもいいです。", "えんぴつで かいても いいです。", "You may write in pencil."]],
  d: [{ k: "c", q: "はいる", f: "may I…? (てもいいですか)", a: ["はいってもいいですか"], en: "may I come in?" },
      { k: "c", q: "つかう", f: "may I…? (てもいいですか)", a: ["つかってもいいですか"], en: "may I use (it)?" },
      { k: "o", t: ["この", "ペンを", "つかっても", "いいですか"], en: "May I use this pen?" }] },
{ id: "tewa", cat: "Using the て-form", t: "～てはいけません — must not", p: "V-ては いけません",
  l: ["<b>て-form + は いけません</b> = “You must not…” — a firm rule: ここで およい<b>では いけません</b>. (て／で becomes ては／では.)",
      "It sounds strict; to ask someone politely not to do something, use ～ないで ください."],
  ex: [["ここで泳いではいけません。", "ここで およいでは いけません。", "You must not swim here."], ["図書館で食べてはいけません。", "としょかんで たべては いけません。", "You must not eat in the library."]],

{ id: "tekara", cat: "Using the て-form", t: "～てから — after doing", p: "V-て から、～",
  l: ["<b>て-form + から</b> = “after doing A, (then) B” — it stresses that A comes first: てを あらって<b>から</b>、ごはんを たべます.",
      "The tense goes at the very end: しゅくだいを して から、テレビを み<b>ました</b>."],
  ex: [["手を洗ってから、ご飯を食べます。", "てを あらって から、ごはんを たべます。", "I wash my hands before eating. (After washing my hands, I eat.)"], ["宿題をしてから、テレビを見ました。", "しゅくだいを して から、テレビを みました。", "After doing my homework, I watched TV."]],
  d: [{ k: "c", q: "かえる (go home)", f: "after …ing (てから)", a: ["かえってから"], en: "after going home" },

      { k: "o", t: ["しゅくだいを", "して", "から", "あそびます"], en: "I'll play after doing my homework." }] },

{ id: "maeato", cat: "Wants & timing", t: "～まえに・～たあとで — before, after", p: "V-dict まえに / V-た あとで",
  l: ["<b>Dictionary form + まえに</b> = “before doing”: ねる <b>まえに</b> ほんを よみます. The verb stays in dictionary form even for past events.",
      "<b>た-form + あとで</b> = “after doing”: ごはんを たべた <b>あとで</b> さんぽします.",
      "With nouns: <b>Noun の まえに／あとで</b>: しごと<b>の あとで</b> (after work)."],
  ex: [["寝る前に本を読みます。", "ねる まえに ほんを よみます。", "I read before going to bed."], ["仕事の後で、友達に会いました。", "しごとの あとで、ともだちに あいました。", "After work I met a friend."], ["ご飯を食べた後で、散歩します。", "ごはんを たべた あとで、さんぽします。", "After eating I take a walk."]],

{ id: "tai", cat: "Wants & timing", t: "～たい — want to", p: "V-stem たい（です）",
  l: ["<b>ます-stem + たい</b> = “want to (do)”: たべ<b>たい</b>, いき<b>たい</b>. It changes like an い-adjective: たく<b>ない</b> (don't want to), た<b>かった</b> (wanted to). Add です to be polite.",
      "The object can take が or を: みずが／みずを のみたいです. Use たい for <b>your own</b> wishes — asking someone else directly with たい can sound blunt."],
  ex: [["日本へ行きたいです。", "にほんへ いきたいです。", "I want to go to Japan."], ["今日は何もしたくないです。", "きょうは なにも したくないです。", "I don't want to do anything today."], ["冷たい水が飲みたいです。", "つめたい みずが のみたいです。", "I want to drink cold water."]],
  d: [{ k: "c", q: "のむ", f: "want to (たいです)", a: ["のみたいです"], en: "want to drink" },
      { k: "c", q: "いく", f: "want to (たいです)", a: ["いきたいです"], en: "want to go" },

      { k: "c", q: "かう", f: "wanted to (たかったです)", a: ["かいたかったです"], en: "wanted to buy" },
      { k: "o", t: ["なつやすみに", "うみへ", "いきたいです"], alt: [["うみへ", "なつやすみに", "いきたいです"]], en: "I want to go to the sea in the summer holidays." }] },
{ id: "hoshii", cat: "Wants & timing", t: "～がほしい — want (a thing)", p: "N が ほしいです",
  l: ["<b>Noun が ほしいです</b> = “I want (a thing)”. ほしい is an い-adjective: ほしく<b>ない</b>です (don't want), ほし<b>かった</b>です (wanted). Like たい, it is for your own wants.",
      "Compare: くるま<b>が ほしい</b>です (I want a car) — くるまを かい<b>たい</b>です (I want to buy a car)."],

  d: [{ k: "p", s: "あたらしい くるま ＿ ほしいです。", a: "が", o: ["が", "で", "に", "へ"], en: "I want a new car." },

      { k: "c", q: "ほしいです", f: "negative (polite)", a: ["ほしくないです", "ほしくありません"], en: "don't want" }] },
{ id: "niiku", cat: "Wants & timing", t: "～にいく — go to do", p: "V-stem に いく／くる／かえる",

      "With する-nouns you can use the noun itself: かいもの<b>に</b> いきます (go shopping), さんぽ<b>に</b> いきます (go for a walk)."],

{ id: "moumada", cat: "Wants & timing", t: "もう・まだ — already, not yet", p: "もう V-ました / まだ V-ていません",

  ex: [["もう宿題をしましたか。", "もう しゅくだいを しましたか。", "Have you done your homework already?"], ["いいえ、まだしていません。", "いいえ、まだ して いません。", "No, I haven't done it yet."]],
  d: [{ k: "m", q: "もう ばんごはんを たべましたか。 — “No, not yet.”", a: "いいえ、まだです。", o: ["いいえ、まだです。", "いいえ、もうです。", "いいえ、まだ たべませんでした。"] },
      { k: "c", q: "かく", f: "haven't … yet (まだ ～ていません)", a: ["まだかいていません"], en: "haven't written yet" },
      { k: "p", s: "＿ しゅくだいを しましたか。", a: "もう", o: ["もう", "まだ", "よく", "とても"], en: "Have you already done your homework?" }] },
/* ---------- Adjectives ---------- */
{ id: "iadj", cat: "Adjectives", t: "い-adjectives", p: "～いです / ～くないです",
  l: ["<b>い-adjectives</b> end in い: たかい, おおきい, さむい. Polite: add です — たかい<b>です</b>.",
      "Negative: change the final い to <b>くない</b>(です): たか<b>くない</b>です. (～くありません is also correct.)",
      "Watch out: <b>いい</b> (good) uses the old stem よ: <b>よくない</b> (not good)."],
  ex: [["この時計は高いです。", "この とけいは たかいです。", "This watch is expensive."], ["今日はあまり寒くないです。", "きょうは あまり さむくないです。", "It isn't very cold today."], ["天気はよくないです。", "てんきは よくないです。", "The weather isn't good."]],
  d: [{ k: "c", q: "たかい", f: "negative (くないです)", a: ["たかくないです", "たかくありません"], en: "not expensive" },
      { k: "c", q: "いい", f: "negative (くないです)", a: ["よくないです", "よくありません"], en: "not good" },
      { k: "c", q: "おもしろい", f: "negative (くないです)", a: ["おもしろくないです", "おもしろくありません"], en: "not interesting" },
      { k: "m", q: "“This bag is not heavy.”", a: "この かばんは おもくないです。", o: ["この かばんは おもくないです。", "この かばんは おもいじゃないです。", "この かばんは おもいないです。"] }] },
{ id: "iadjpast", cat: "Adjectives", t: "い-adjectives in the past", p: "～かったです / ～くなかったです",
  l: ["Past: final い → <b>かった</b>(です): たのし<b>かった</b>です (it was fun). Past negative: <b>くなかった</b>(です).",
      "A very common mistake is ～いでした — never say たのしいでした. And again: いい → <b>よかった</b>, <b>よくなかった</b>."],
  ex: [["旅行はとても楽しかったです。", "りょこうは とても たのしかったです。", "The trip was a lot of fun."], ["昨日は暑くなかったです。", "きのうは あつくなかったです。", "It wasn't hot yesterday."]],
  d: [{ k: "c", q: "たのしい", f: "past (かったです)", a: ["たのしかったです"], en: "was fun" },
      { k: "c", q: "いい", f: "past (かったです)", a: ["よかったです"], en: "was good" },
      { k: "c", q: "さむい", f: "past negative (くなかったです)", a: ["さむくなかったです", "さむくありませんでした"], en: "wasn't cold" },
      { k: "m", q: "“The test was difficult.”", a: "テストは むずかしかったです。", o: ["テストは むずかしかったです。", "テストは むずかしいでした。", "テストは むずかしいだったです。"] }] },
{ id: "naadj", cat: "Adjectives", t: "な-adjectives", p: "～です / ～じゃないです / ～でした",
  l: ["<b>な-adjectives</b> (しずか, げんき, ゆうめい, すき, べんり) behave like nouns: しずか<b>です</b>, しずか<b>では ありません</b>／<b>じゃないです</b>, しずか<b>でした</b>, しずか<b>じゃなかったです</b>.",
      "Traps: <b>きれい</b> and <b>きらい</b> end in い but are な-adjectives — きれい<b>じゃない</b>, not きれくない."],
  ex: [["この町は静かです。", "この まちは しずかです。", "This town is quiet."], ["部屋はきれいじゃありません。", "へやは きれいじゃ ありません。", "The room isn't clean."], ["昨日は暇でした。", "きのうは ひまでした。", "I was free yesterday."]],
  d: [{ k: "c", q: "しずかです", f: "negative (polite)", a: ["しずかではありません", "しずかじゃありません", "しずかじゃないです", "しずかではないです"], en: "not quiet" },
      { k: "c", q: "きれいです", f: "negative (polite)", a: ["きれいではありません", "きれいじゃありません", "きれいじゃないです", "きれいではないです"], en: "not pretty/clean" },
      { k: "c", q: "ひまです", f: "past (polite)", a: ["ひまでした"], en: "was free" },
      { k: "m", q: "Which word is a な-adjective?", a: "きれい", o: ["きれい", "あかい", "おおきい", "ふるい"] }] },
{ id: "adjnoun", cat: "Adjectives", t: "Adjective + noun", p: "～い N / ～な N",
  l: ["Before a noun, an い-adjective stays as it is: <b>たかい</b> くるま. A な-adjective adds <b>な</b>: <b>しずかな</b> へや.",
      "Some describing words are nouns and take <b>の</b>: びょうき<b>の</b> ひと.",
      "Two い-adjectives are joined with <b>くて</b>: やす<b>くて</b> おいしい (cheap and tasty); a な-adjective with <b>で</b>: しずか<b>で</b> きれい."],
  ex: [["静かな部屋で勉強します。", "しずかな へやで べんきょうします。", "I study in a quiet room."], ["あの赤い車は父のです。", "あの あかい くるまは ちちのです。", "That red car is my father's."], ["この店は安くておいしいです。", "この みせは やすくて おいしいです。", "This place is cheap and tasty."]],
  d: [{ k: "p", s: "ゆうめい ＿ ひとに あいました。", a: "な", o: ["な", "の", "い", "に"], en: "I met a famous person." },
      { k: "m", q: "“a big house”", a: "おおきい いえ", o: ["おおきい いえ", "おおきいな いえ", "おおきいの いえ", "おおきく いえ"] },
      { k: "m", q: "“a quiet park”", a: "しずかな こうえん", o: ["しずかな こうえん", "しずか こうえん", "しずかの こうえん", "しずかい こうえん"] },
      { k: "c", q: "やすい", f: "and… (くて)", a: ["やすくて"], en: "cheap and…" }] },
{ id: "naru", cat: "Adjectives", t: "～なります — become", p: "～く なります / ～に なります",
  l: ["<b>なる</b> = “to become”. い-adjective: い → <b>く</b> なります: さむ<b>く なりました</b> (it got cold).",
      "な-adjective or noun: <b>に</b> なります: げんき<b>に なりました</b> (got better), いしゃ<b>に なりたい</b> (want to become a doctor)."],
  ex: [["暖かくなりましたね。", "あたたかく なりましたね。", "It's got warmer, hasn't it?"], ["先生になりたいです。", "せんせいに なりたいです。", "I want to become a teacher."], ["部屋がきれいになりました。", "へやが きれいに なりました。", "The room got clean."]],
  d: [{ k: "c", q: "さむい", f: "became (なりました)", a: ["さむくなりました"], en: "got cold" },
      { k: "c", q: "げんき", f: "became (なりました)", a: ["げんきになりました"], en: "got well" },
      { k: "p", s: "もう じゅうじです。おそ ＿ なりました。", a: "く", o: ["く", "に", "な", "い"], en: "It's already ten. It's got late." }] },
/* ---------- Existence & location ---------- */
{ id: "aru", cat: "Existence & location", t: "あります・います — there is", p: "N が あります / います",
  l: ["Both mean “there is / to have”. Use <b>います</b> for living things that move (people, animals) and <b>あります</b> for everything else (things, plants, events).",
      "Negative: ありません／いません. Having: わたしは あにが <b>います</b> (I have an older brother); じかんが <b>ありません</b> (I have no time)."],
  ex: [["公園に犬がいます。", "こうえんに いぬが います。", "There's a dog in the park."], ["机の上に辞書があります。", "つくえの うえに じしょが あります。", "There's a dictionary on the desk."], ["私は兄弟がいません。", "わたしは きょうだいが いません。", "I don't have any brothers or sisters."]],
  d: [{ k: "p", s: "にわに ねこが ＿。", a: "います", o: ["います", "あります"], en: "There's a cat in the garden." },
      { k: "p", s: "えきの まえに ぎんこうが ＿。", a: "あります", o: ["あります", "います"], en: "There's a bank in front of the station." },
      { k: "p", s: "きょうしつに せんせいが ＿。", a: "います", o: ["います", "あります"], en: "The teacher is in the classroom." },
      { k: "p", s: "あした テストが ＿。", a: "あります", o: ["あります", "います"], en: "There's a test tomorrow." }] },
{ id: "loc", cat: "Existence & location", t: "Where things are", p: "Place に N が あります / N は Place に あります",
  l: ["Two orders, two feelings:<br>• <b>Place に X が あります</b> — introduces something new: “On the desk there is a pen.”<br>• <b>X は Place に あります</b> — says where a known thing is: “The pen is on the desk.” (Short version: ペンは つくえの うえ<b>です</b>.)",
      "Position words follow <b>Noun の</b>: <b>うえ</b> (on, above), <b>した</b> (under), <b>なか</b> (in), <b>そと</b> (outside), <b>まえ</b> (in front), <b>うしろ</b> (behind), <b>となり</b> (next to), <b>よこ</b> (beside), <b>ちかく</b> (near), <b>あいだ</b> (between)."],
  ex: [["かばんは椅子の下にあります。", "かばんは いすの したに あります。", "The bag is under the chair."], ["銀行は郵便局の隣です。", "ぎんこうは ゆうびんきょくの となりです。", "The bank is next to the post office."], ["箱の中に何がありますか。", "はこの なかに なにが ありますか。", "What's in the box?"]],
  d: [{ k: "m", q: "“The cat is under the table.”", a: "ねこは テーブルの したに います。", o: ["ねこは テーブルの したに います。", "ねこは テーブルの うえに います。", "ねこは テーブルの したに あります。", "ねこは テーブルの したを います。"] },
      { k: "m", q: "となり means…", a: "next to", o: ["next to", "behind", "inside", "under"] },
      { k: "o", t: ["つくえの", "うえに", "ほんが", "あります"], en: "There is a book on the desk." },
      { k: "o", t: ["ゆうびんきょくは", "えきの", "まえに", "あります"], en: "The post office is in front of the station." }] },
/* ---------- こそあど ---------- */
{ id: "kore", cat: "こそあど words", t: "これ・それ・あれ・どれ", p: "これ／それ／あれ は N です",
  l: ["Pointing words stand alone as nouns: <b>これ</b> (this — near me), <b>それ</b> (that — near you), <b>あれ</b> (that over there — far from both of us), <b>どれ</b> (which one? — out of three or more).",
      "どれ is a question word, so it takes が, not は: どれ<b>が</b> あなたの かさですか。"],
  ex: [["これは何ですか。", "これは なんですか。", "What is this?"], ["それは私の辞書です。", "それは わたしの じしょです。", "That (by you) is my dictionary."], ["どれがあなたの傘ですか。", "どれが あなたの かさですか。", "Which one is your umbrella?"]],
  d: [{ k: "m", q: "Pointing at something far from both of you: “What is that over there?”", a: "あれは なんですか。", o: ["あれは なんですか。", "これは なんですか。", "それは なんですか。"] },
      { k: "p", s: "＿ が あなたの かばんですか。", a: "どれ", o: ["どれ", "あれ", "これ", "それ"], en: "Which one is your bag?" },
      { k: "m", q: "You're holding a pen: “This is a pen.”", a: "これは ペンです。", o: ["これは ペンです。", "それは ペンです。", "あれは ペンです。"] }] },
{ id: "kono", cat: "こそあど words", t: "この・その・あの・どの", p: "この／その／あの／どの + N",
  l: ["<b>この, その, あの, どの</b> must be followed by a noun: <b>この</b> ほん (this book), <b>あの</b> ひと (that person), <b>どの</b> かさ (which umbrella?).",
      "Compare: これは たかいです — <b>この とけい</b>は たかいです. You cannot say この alone or これ ほん."],
  ex: [["この本は面白いです。", "この ほんは おもしろいです。", "This book is interesting."], ["あの人は誰ですか。", "あの ひとは だれですか。", "Who is that person?"], ["どの傘があなたのですか。", "どの かさが あなたのですか。", "Which umbrella is yours?"]],
  d: [{ k: "p", s: "＿ ほんは いくらですか。", a: "この", o: ["この", "これ", "ここ", "こちら"], en: "How much is this book?" },
      { k: "p", s: "＿ ひとは だれですか。", a: "あの", o: ["あの", "あれ", "あそこ", "あちら"], en: "Who is that person over there?" },
      { k: "p", s: "＿ は いくらですか。", a: "これ", o: ["これ", "この", "ここの", "こう"], en: "How much is this?" }] },
{ id: "koko", cat: "こそあど words", t: "ここ・そこ・あそこ・どこ", p: "ここ／そこ／あそこ／どこ",
  l: ["Places: <b>ここ</b> (here), <b>そこ</b> (there, near you), <b>あそこ</b> (over there), <b>どこ</b> (where?). Note: あ<b>そ</b>こ, not あこ.",
      "The polite versions are <b>こちら, そちら, あちら, どちら</b> (also meaning “this way / this person”): トイレは あちらです."],
  ex: [["トイレはどこですか。", "トイレは どこですか。", "Where is the toilet?"], ["駅はあそこです。", "えきは あそこです。", "The station is over there."], ["こちらは田中さんです。", "こちらは たなかさんです。", "This is Mr./Ms. Tanaka."]],
  d: [{ k: "p", s: "トイレは ＿ ですか。", a: "どこ", o: ["どこ", "いつ", "どの", "だれ"], en: "Where is the toilet?" },
      { k: "m", q: "Introducing a person politely: “This is Ms. Yamada.”", a: "こちらは やまださんです。", o: ["こちらは やまださんです。", "これは やまださんです。", "ここは やまださんです。"] },
      { k: "m", q: "“over there” is…", a: "あそこ", o: ["あそこ", "あこ", "あれこ", "あちこ"] }] },
/* ---------- Questions & numbers ---------- */
{ id: "qwords", cat: "Questions & numbers", t: "Question words", p: "なに・だれ・いつ・どこ・どう…",
  l: ["Question words stay where the answer would go; add か at the end: <b>なに</b>を たべますか.",
      "<b>なに／なん</b> what (なん before です and counters: なんですか, なんじ, なんにん) · <b>だれ</b> who (polite: どなた) · <b>いつ</b> when · <b>どこ</b> where · <b>どう</b> how (polite: いかが) · <b>いくら</b> how much · <b>いくつ</b> how many / how old · <b>どうして</b> why · <b>どんな</b> what kind of.",
      "いつ is never followed by に: <b>いつ</b> いきますか."],
  ex: [["誕生日はいつですか。", "たんじょうびは いつですか。", "When is your birthday?"], ["この傘はいくらですか。", "この かさは いくらですか。", "How much is this umbrella?"], ["どうして来ませんでしたか。", "どうして きませんでしたか。", "Why didn't you come?"]],
  d: [{ k: "p", s: "これは ＿ ですか。　— えんぴつです。", a: "なん", o: ["なん", "だれ", "いつ", "どこ"], en: "What is this? — A pencil." },
      { k: "p", s: "＿ が きましたか。　— やまださんです。", a: "だれ", o: ["だれ", "なに", "どこ", "いつ"], en: "Who came? — Yamada-san." },
      { k: "p", s: "この シャツは ＿ ですか。　— ごひゃくえんです。", a: "いくら", o: ["いくら", "いくつ", "どう", "どこ"], en: "How much is this shirt? — 500 yen." },
      { k: "p", s: "＿ がっこうを やすみましたか。　— かぜを ひきましたから。", a: "どうして", o: ["どうして", "どこ", "だれ", "いくら"], en: "Why were you absent from school? — Because I caught a cold." },
      { k: "p", s: "なつやすみは ＿ からですか。　— しちがつ にじゅうにちからです。", a: "いつ", o: ["いつ", "どう", "なに", "だれ"], en: "When does summer vacation start? — From July 20." }] },
{ id: "qmo", cat: "Questions & numbers", t: "なにも・だれも / なにか・だれか", p: "Q-word + も (neg.) / Q-word + か",
  l: ["<b>Question word + も + negative</b> = “nothing / nobody / nowhere”: <b>なにも</b> たべません, <b>だれも</b> いません. With a particle, it sits between: <b>どこへも</b> いきません, だれ<b>とも</b> はなしません.",
      "<b>Question word + か</b> = “something / someone / somewhere”: <b>なにか</b> のみますか (Will you drink something?), <b>だれか</b> きました (Someone came)."],
  ex: [["朝から何も食べていません。", "あさから なにも たべて いません。", "I haven't eaten anything since morning."], ["教室に誰もいません。", "きょうしつに だれも いません。", "There's no one in the classroom."], ["何か飲みませんか。", "なにか のみませんか。", "Would you like something to drink?"]],
  d: [{ k: "p", s: "きのうは ＿ たべませんでした。", a: "なにも", o: ["なにも", "なにか", "なにを", "なんでも"], en: "I didn't eat anything yesterday." },
      { k: "p", s: "へやに ＿ いますか。　— はい、たなかさんが います。", a: "だれか", o: ["だれか", "だれも", "だれが", "だれを"], en: "Is anyone in the room? — Yes, Tanaka-san is." },
      { k: "p", s: "にちようびは どこ ＿ いきませんでした。", a: "へも", o: ["へも", "もへ", "をも", "にを"], en: "I didn't go anywhere on Sunday." }] },
{ id: "counters", cat: "Questions & numbers", t: "Counting things & people", p: "N を Number+counter Verb",
  l: ["Numbers usually go <b>right before the verb</b>, with no particle: りんごを <b>みっつ</b> かいました.",
      "General things: ひとつ, ふたつ, みっつ, よっつ, いつつ, むっつ, ななつ, やっつ, ここのつ, とお (how many: いくつ).<br>People: <b>ひとり, ふたり</b>, さんにん, よにん… (なんにん). Flat things: ～<b>まい</b>. Long things: ～<b>ほん</b> (いっぽん, にほん, さんぼん). Books: ～さつ. Small animals: ～ひき. Machines and cars: ～だい."],
  ex: [["パンを三つ買いました。", "パンを みっつ かいました。", "I bought three bread rolls."], ["家族は四人です。", "かぞくは よにんです。", "There are four of us in my family."], ["切手を二枚ください。", "きってを にまい ください。", "Two stamps, please."]],
  d: [{ k: "p", s: "きょうしつに がくせいが ＿ います。", a: "ふたり", o: ["ふたり", "ふたつ", "にまい", "にほん"], en: "There are two students in the classroom." },
      { k: "p", s: "かみを ＿ ください。", a: "さんまい", o: ["さんまい", "さんぼん", "さんにん", "さんさつ"], en: "Three sheets of paper, please." },
      { k: "p", s: "えんぴつが ＿ あります。", a: "ごほん", o: ["ごほん", "ごまい", "ごにん", "ごさつ"], en: "There are five pencils." },
      { k: "m", q: "How do you say “one person”?", a: "ひとり", o: ["ひとり", "いちにん", "ひとつ", "いちり"] },
      { k: "o", t: ["たまごを", "みっつ", "かいました"], en: "I bought three eggs." }] },
{ id: "time", cat: "Questions & numbers", t: "Telling the time", p: "～じ ～ふん／ぷん",
  l: ["Hours: number + <b>じ</b>. Learn three: <b>よじ</b> (4:00), <b>しちじ</b> (7:00), <b>くじ</b> (9:00). Half past: <b>はん</b> (さんじはん = 3:30). <b>ごぜん</b> = a.m., <b>ごご</b> = p.m.",
      "Minutes: ～<b>ふん</b> or ～<b>ぷん</b>: いっぷん, にふん, さんぷん, よんぷん, ごふん, ろっぷん, ななふん, はっぷん, きゅうふん, じゅっぷん. What time? <b>なんじ</b>. How many minutes? <b>なんぷん</b>."],
  ex: [["今、何時ですか。", "いま、なんじですか。", "What time is it now?"], ["午後四時半です。", "ごご よじはんです。", "It's 4:30 p.m."], ["九時十分に会いましょう。", "くじ じゅっぷんに あいましょう。", "Let's meet at 9:10."]],
  d: [{ k: "m", q: "4:00", a: "よじ", o: ["よじ", "よんじ", "しじ", "よっじ"] },
      { k: "m", q: "9:30", a: "くじはん", o: ["くじはん", "きゅうじはん", "くじさんぷん", "きゅうじさんじゅう"] },
      { k: "m", q: "7:10", a: "しちじ じゅっぷん", o: ["しちじ じゅっぷん", "しちじ とおふん", "しちにち じゅっぷん", "しちじ じゅっこ"] },

/* ================= Grammar: N5 grammar points — lessons, drills and their own FSRS track =================
   S.gcards = { id: card }  (same card shape as words: c.f = FSRS track, c.due, c.box; c.g = 1 marks the grammar track)
   S.grLimit: new grammar points per day (default 2, or "off"); S.newLogG = {"YYYY-MM-DD": [ids]} (synced as a union).
   Drills grade the whole point once: 0 mistakes → Good, 1 → Hard, 2+ → Again. Practice outside a due review never
   changes the schedule. Content (GR_DATA) is original, written for this app. */
const GR = {}; GR_DATA.forEach((p, i) => { p.n = i + 1; GR[p.id] = p; });
const GR_CATS = [...new Set(GR_DATA.map(p => p.cat))];
const GR_PRESETS = [1, 2, 3, 5];
const GR_KIND = { p: "Particle choice", m: "Choose", c: "Conjugation", o: "Sentence order" };
const grLimitV = () => limV(S.grLimit, 2);
/* read-only accessors never add keys to S (restore / undo compare stores exactly); grGrade creates them on first use */
const isMap = x => !!x && typeof x === "object" && !Array.isArray(x);
const gcards = () => isMap(S.gcards) ? S.gcards : {};
const newTodayG = () => isMap(S.newLogG) && Array.isArray(S.newLogG[todayStr()]) ? S.newLogG[todayStr()] : [];
const newLeftG = () => Math.max(0, grLimitV() - newTodayG().length);
const isNewG = id => !gcards()[id] && !newTodayG().includes(id);
const canIntroG = id => !isNewG(id) || newLeftG() > 0;
function markNewG(id) {
  if (!isNewG(id)) return false;
  const L = nlog("newLogG"), t = todayStr(); (L[t] = L[t] || []).push(id); nlPrune("newLogG"); return true;
}
function grDueScan() {
  const now = Date.now(), G = gcards(), ids = []; let next = Infinity;
  for (const id in G) { if (!GR[id]) continue; const d = G[id].due; if (d <= now) ids.push(id); else if (d < next) next = d; }
  ids.sort((a, b) => G[a].due - G[b].due);
  return { ids, next: next === Infinity ? null : next - now };
}
const grLearned = () => Object.keys(gcards()).filter(id => GR[id]).length;
const grNextNew = () => GR_DATA.find(p => !gcards()[p.id]) || null;
const grWanted = () => (S.levels || ["n5"]).includes("n5") || grLearned() > 0;   // grammar is N5 material
function grStatus(id) {
  const c = gcards()[id]; if (!c || !c.f) return "new";
  if (c.due <= Date.now()) return "due";
  return c.f.st === 2 && c.f.s >= 21 ? "known" : "learning";
}
const GR_ST = { new: "New", due: "Due", learning: "Learning", known: "Known" };
/* one FSRS review for a grammar point (r = 1..4) */
function grGrade(id, r) {
  if (!isMap(S.gcards)) S.gcards = {};
  const G = S.gcards, isNew = !G[id];
  const c = G[id] || { g: 1, ok: 0, bad: 0 };
  c.g = 1; markNewG(id);
  srsAnswer(c, id, r > 1, { rating: r });
  c.t = Date.now(); G[id] = c;
  schedShow(c, { quiet: true }, "g", id);
  trackItem(isNew); touchStreak(); save();
  if (typeof updateDueBadge === "function") updateDueBadge();
  return c;
}
const grAudio = (id, i, d) => `gr/${id}-${d ? "d" : ""}${i + 1}.mp3`;
const grSayBtn = (text, path) => `<button class="mini grsay" data-say="${esc(text)}" ${path ? `data-sap="${esc(path)}"` : ""} aria-label="Play audio">🔈</button>`;
/* the sentence a drill teaches (blank filled / tiles in order), used for feedback + audio */
function grDrillSentence(d) {
  if (d.k === "p") return d.s.replace("＿", d.a);
  if (d.k === "o") return d.t.join(" ") + (/[。？]$/.test(d.t[d.t.length - 1]) ? "" : "。");
  return "";
}
const grSpeakText = s => s.replace(/（[^）]*）/g, "").replace(/[AB]：/g, "").replace(/\s+/g, " ").trim();

/* ---------- Hub ---------- */
function grammarHome() {
  const back = home, G = gcards(), due = grDueScan(), nx = grNextNew(), learned = grLearned(), left = newLeftG(), lim = grLimitV();
  const limTxt = lim === Infinity ? "no daily limit" : `${left} of ${lim} new point${lim === 1 ? "" : "s"} left today`;
  let hero;
  if (due.ids.length) hero = `<div class="hero"><div class="ic">⏰</div><div><h2>${due.ids.length} grammar review${due.ids.length === 1 ? "" : "s"} due</h2><p>2–3 quick drills per point</p></div><button class="btn" id="grRev">Review ▶</button></div>`;
  else if (nx) hero = `<div class="hero ${left ? "" : "done"}"><div class="ic">🌱</div><div><h2>Next: ${esc(nx.t)}</h2><p>Point ${nx.n} of ${GR_DATA.length} · ${limTxt}${left ? "" : " — come back tomorrow, or practise what you know"}</p></div><button class="btn ${left ? "" : "ghost"}" id="grNext">${left ? "Learn ▶" : "Read lesson"}</button></div>`;
  else hero = `<div class="hero done"><div class="ic">🎉</div><div><h2>All ${GR_DATA.length} points learned</h2><p>${due.next != null ? `Next grammar review ${fmtIn(due.next)}` : ""}</p></div></div>`;
  view.innerHTML = topbar("文 Grammar") + `<div class="largetitle">N5 Grammar</div>
    <p class="subtitle" id="grSub">${learned} of ${GR_DATA.length} points learned · ${due.ids.length} due · ${limTxt}</p>${hero}
    ${GR_CATS.map(cat => `<div class="panel grcat"><h2>${esc(cat)}</h2>${GR_DATA.filter(p => p.cat === cat).map(p => { const st = grStatus(p.id);
      return `<button class="grrow" data-g="${p.id}"><span class="grn">${p.n}</span><span class="grow"><b>${esc(p.t)}</b><small class="jp">${esc(p.p)}</small></span><span class="grst st-${st}">${GR_ST[st]}</span></button>`; }).join("")}</div>`).join("")}
    <p class="muted grcredit">Lessons, examples and drills are original, written for this app. Example audio: Microsoft neural TTS voice ja-JP-KeitaNeural via edge-tts (two-person drills add ja-JP-NanamiNeural). Each point gets its own memory schedule (the Grammar track in Review).</p>`;
  bindBack(back);
  const rv = $("#grRev"); if (rv) rv.onclick = () => { sfx.click(); go(() => grSession(grDueScan().ids, "review", "⏰ Grammar · due", grammarHome)); };

  view.querySelectorAll(".grrow").forEach(b => b.onclick = () => { sfx.click(); go(() => grLesson(b.dataset.g, grammarHome)); });
}

/* ---------- Lesson ---------- */
function grLesson(id, back = grammarHome) {
  const p = GR[id]; if (!p) return grammarHome();
  const st = grStatus(id), c = gcards()[id];
  const mode = st === "due" ? "review" : st === "new" && canIntroG(id) ? "learn" : "practice";
  const label = mode === "review" ? "Review now ▶" : mode === "learn" ? "Start drills ▶" : "Practice drills ▶";
  const note = mode === "learn" ? `${p.d.length} drills · then this point joins your Grammar reviews${grLimitV() === Infinity ? "" : ` (${newLeftG()} of ${grLimitV()} new left today)`}`
    : st === "new" ? `Daily new-grammar limit reached (${grLimitV()}) — you can practise, but it won't be scheduled until tomorrow`
    : mode === "review" ? "Due now — 2–3 drills, graded on the Grammar track" : `${GR_ST[st]} · ${trackText(c.f)} · practice won't change the schedule`;
  const prev = GR_DATA[p.n - 2], nxt = GR_DATA[p.n];

    <div class="qtype">${esc(p.cat)}</div><h2 class="grtitle">${esc(p.t)}</h2><div class="grpat jp">${esc(p.p)}</div>
    ${p.l.map(x => `<p>${x}</p>`).join("")}
    <h3>Examples</h3><ul class="grex">${p.ex.map((e, i) => `<li><div class="grjp jp">${esc(e[0])} ${grSayBtn(/家/.test(e[0]) ? e[1] : e[0], grAudio(id, i))}</div><div class="grkana jp">${esc(e[1])}</div><div class="muted">${esc(e[2])}</div></li>`).join("")}</ul></div>
    <div class="grgo"><button class="btn" id="grGo">${label}</button><p class="muted" id="grNote">${note}</p></div>
    <div class="btnrow grnav">${prev ? `<button class="btn ghost small" id="grPrev">← ${esc(prev.t.split(" — ")[0])}</button>` : ""}${nxt ? `<button class="btn ghost small" id="grNextL">${esc(nxt.t.split(" — ")[0])} →</button>` : ""}</div>`;
  bindBack(back);
  $("#grGo").onclick = () => { sfx.click(); go(() => grSession([id], mode, `文 ${p.t}`, () => grLesson(id, back))); };
  const pv = $("#grPrev"); if (pv) pv.onclick = () => go(() => grLesson(prev.id, back));
  const nv = $("#grNextL"); if (nv) nv.onclick = () => go(() => grLesson(nxt.id, back));
}

/* ---------- Drill session ----------
   mode "learn": every drill of a new point, graded (adds it to the track) · "review": 3 drills per due point, graded
   · "practice": up to 4 drills, never graded */
function grSession(ids, mode, title, back, then) {
  ids = ids.filter(id => GR[id]);
  if (!ids.length) { toast("Nothing to review"); return go(back || grammarHome); }
  if (mode === "review") ids = ids.slice(0, batchOf(ids.length));
  studyScreen = true;
  const queue = [], left = {}, errs = {}, results = [];
  for (const id of ids) {
    const all = GR[id].d.map((d, i) => i);
    const pick = mode === "learn" ? all : shuffle(all).slice(0, mode === "review" ? 3 : 4);
    pick.forEach(i => queue.push({ id, i })); left[id] = pick.length; errs[id] = 0;
  }
  let pos = 0, right = 0, answered = false, q = null;
  view.innerHTML = topbar(esc(title), `<span class="muted" id="score"></span>`) + `<div class="sprog"><div id="sprog" style="width:0"></div></div><div id="qhost"></div>
    <p class="muted kbdhint" style="text-align:center;font-size:.8rem">Keys <kbd>1</kbd>–<kbd>4</kbd> choose · <kbd>Enter</kbd> check / next</p>`;
  bindBack(back || grammarHome);
  const progress = () => { $("#sprog").style.width = (pos / queue.length * 100) + "%"; $("#score").textContent = `${pos}/${queue.length}`; };
  const finishPoint = id => {
    const e = errs[id], r = e === 0 ? 3 : e === 1 ? 2 : 1;
    let graded = false;
    if (mode === "review" || (mode === "learn" && canIntroG(id))) { grGrade(id, r); graded = true; }
    results.push({ id, r, graded });
  };
  const next = () => {
    answered = false; progress(); scrollTo(0, 0);
    if (pos >= queue.length) { q = null; return finish(); }
    const it = queue[pos];
    q = grRenderDrill(it.id, it.i, (ok, el) => {
      answered = true; pos++; if (ok) right++; else errs[it.id]++;
      comboHit(ok, el, 6);
      if (--left[it.id] === 0) finishPoint(it.id);
      progress();
      const fb = $("#fb"), nb = document.createElement("div"); nb.className = "btnrow"; nb.innerHTML = `<button class="btn" id="nextBtn">Next →</button>`; fb.appendChild(nb);
      $("#nextBtn").onclick = next;
    }, mode === "learn" ? pos + 1 + "/" + queue.length : "");
  };
  const finish = () => {
    addXP(Math.min(40, queue.length * 2));
    if (then) return then({ right, n: queue.length });
    const anyGraded = results.some(x => x.graded);
    $("#qhost").innerHTML = `<div class="card grfinish" id="grFinish"><div class="qtype">${mode === "practice" ? "Practice done" : "Grammar done!"}</div><div class="big">${right === queue.length ? "🌟" : "✅"}</div>
      <p>${right}/${queue.length} drills correct</p>
      <ul class="grres">${results.map(x => `<li><span class="grow">${esc(GR[x.id].t)}</span>${x.graded ? `<span class="rtag r${x.r}">${RATE_NAMES[x.r]}</span>` : `<span class="muted">not scheduled</span>`}</li>`).join("")}</ul>
      ${anyGraded ? nextReviewListHTML() : `<p class="muted">Practice only — your Grammar schedule is unchanged.</p>`}
      <div class="btnrow"><button class="btn" id="grDone">${back && back !== grammarHome && !String(back).includes("grLesson") ? "Done" : "Grammar"}</button><button class="btn ghost" id="grHome">Home</button></div></div>`;
    sfx.level(); if (right === queue.length) confetti(100);
    $("#grDone").onclick = () => go(back || grammarHome); $("#grHome").onclick = () => go(home);
    $("#sprog").style.width = "100%";
  };
  const onKey = e => {
    if (document.querySelector(".modal")) return;
    if (!answered && q && e.key === "Enter" && q.submit) { e.preventDefault(); q.submit(); return; }
    if (e.target.tagName === "INPUT" && !e.target.disabled) return;
    if (!answered && q && q.choose && /^[1-4]$/.test(e.key)) q.choose(+e.key - 1);
    else if (answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const b = $("#nextBtn"); if (b) b.click(); }
  };
  addEventListener("keydown", onKey);
  cleanup = () => removeEventListener("keydown", onKey);
  next();
}
/* render one drill into #qhost; onAnswer(ok, el) once. Returns { choose?, submit? } */

      <input class="typein" id="typein" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="ja" placeholder="kana or romaji">
      <div class="typehelp">Romaji converts as you type · <b>nn</b> for ん · Enter to check</div>
      <div class="btnrow"><button class="btn" id="checkBtn">Check</button><button class="btn ghost" id="giveBtn">🤷 I don't know</button></div>

    return { submit: () => submit() };
  }
  /* sentence order: tap tiles to build the sentence; tap a placed tile to put it back */
  const order = shuffle(d.t.map((t, k) => k));
  if (d.t.length > 1 && order.every((k, j) => k === j)) order.push(order.shift());
  const placed = [];
  host.innerHTML = `<div class="card grcard" data-k="o">${head}<div class="muted grhint">${esc(d.en)}</div>

    <div class="btnrow"><button class="btn" id="checkBtn" disabled>Check</button><button class="btn ghost" id="giveBtn">🤷 I don't know</button></div>
    <div class="feedback" id="fb"></div></div>`;

    pool.innerHTML = order.map(k => `<button class="grtile" data-k="${k}" ${placed.includes(k) ? "disabled" : ""}>${esc(d.t[k])}</button>`).join("");
    chk.disabled = placed.length !== d.t.length || done;
  };
  pool.onclick = e => { const b = e.target.closest(".grtile"); if (!b || done || b.disabled) return; sfx.click(); placed.push(+b.dataset.k); draw(); };
  ans.onclick = e => { const b = e.target.closest(".grtile"); if (!b || done) return; placed.splice(+b.dataset.j, 1); draw(); };

    if (done || (!give && placed.length !== d.t.length)) return; done = true;
    const got = placed.map(k => d.t[k]).join("|"), ok = !give && [d.t].concat(d.alt || []).some(a => a.join("|") === got);

    ans.classList.add(ok ? "ok" : "bad"); pool.querySelectorAll(".grtile").forEach(b => b.disabled = true);
    host.querySelector("#fb").innerHTML = fbHTML(ok); bindLink();
    onAnswer(ok, ans);
  };
  chk.onclick = () => submit(); host.querySelector("#giveBtn").onclick = () => submit(true);
  draw();
  return { submit: () => submit(), choose: j => { const b = pool.querySelectorAll(".grtile:not([disabled])")[j]; if (b) b.click(); } };

    <div class="btnrow"><button class="btn" id="grModalClose">Close</button></div></div>`;

function rdQuiz(id, back = readingHome) {
  const st = RD[id]; if (!st) return readingHome();
  studyScreen = true;
  const qs = st.q.map(q => ({ q, opts: shuffle(q.o) }));
  let pos = 0, right = 0, answered = false, t0 = 0;
  const words = {};   // key-word id → worst rating this run
  view.innerHTML = topbar(`読 ${esc(st.en)}`, `<span class="muted" id="score"></span>`) + `<div class="sprog"><div id="sprog" style="width:0"></div></div><div id="qhost"></div>
    <p class="muted kbdhint" style="text-align:center;font-size:.8rem">Keys <kbd>1</kbd>–<kbd>4</kbd> choose · <kbd>Enter</kbd> next</p>`;
  bindBack(() => rdStory(id, back));
  const progress = () => { $("#sprog").style.width = (pos / qs.length * 100) + "%"; $("#score").textContent = `${pos}/${qs.length}`; };
  const show = () => {
    answered = false; progress(); scrollTo(0, 0);
    if (pos >= qs.length) return finish();
    const { q, opts } = qs[pos];
    $("#qhost").innerHTML = `<div class="card rdq" data-q="${pos}"><div class="qtype">Question ${pos + 1} of ${qs.length}</div>
      <div class="grq jp rdqq">${rdRuby(rdPlain(q.q))}</div><div class="muted grhint">${esc(q.qe)}</div>
      <div class="choices grlong">${opts.map((o, j) => `<button class="choice jp" data-i="${j}"><span class="k">${j + 1}</span>${rdRuby(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div><button class="btn ghost small" id="rdPeek">📖 Look at the story</button></div>`;
    t0 = performance.now();
    const btns = [...view.querySelectorAll("#qhost .choice")];
    const choose = j => {
      if (answered || !btns[j]) return; answered = true;
      const ok = opts[j] === q.o[0], slow = performance.now() - t0 > RD_HARD_MS;
      btns.forEach((b, k) => { b.disabled = true; if (opts[k] === q.o[0]) b.classList.add("right"); }); if (!ok) btns[j].classList.add("wrong");
      if (ok) right++;
      const r = ok ? (slow ? 2 : 3) : 1;
      for (const k of q.k) { const wid = k in RD_MAP.jp ? RD_MAP.jp[k] : RD_MAP.kana[k]; if (wid != null && rdInReview(wid)) words[wid] = Math.min(words[wid] || 4, r); }
      comboHit(ok, btns[j], 6); pos++; progress();
      $("#fb").innerHTML = `<div class="${ok ? "grok" : "grbad"}">${ok ? "✅ Correct!" : `❌ The answer: <span class="jp">${rdRuby(q.o[0])}</span>`}</div><div class="btnrow"><button class="btn" id="nextBtn">${pos >= qs.length ? "See results" : "Next →"}</button></div>`;
      $("#nextBtn").onclick = show;
    };
    btns.forEach((b, j) => b.onclick = () => choose(j));
    $("#rdPeek").onclick = () => rdStoryModal(st);
    QZ.choose = choose;
  };
  const QZ = { choose: null };
  const finish = () => {
    const graded = Object.entries(words).map(([wid, r]) => { grade(+wid, r > 1, { rating: r, quiet: true, listen: false }); return { wid: +wid, r }; });
    if (!isMap(S.rdDone)) S.rdDone = {};
    S.rdDone[id] = Math.max(S.rdDone[id] || 0, right);
    const L = nlog("rdDay"), t = todayStr(); L[t] = [...new Set([...(L[t] || []), id])].sort(); nlPrune("rdDay");
    touchStreak(); save(); addXP(10 + right * 3);
    const nx = rdNext();
    $("#qhost").innerHTML = `<div class="card grfinish" id="rdFinish"><div class="qtype">Story done!</div><div class="big">${right === qs.length ? "🌟" : "✅"}</div>
      <p>${right}/${qs.length} questions correct</p>
      ${graded.length ? `<ul class="grres">${graded.map(x => `<li><span class="grow jp">${esc(WORDS[x.wid].jp)}</span><span class="rtag r${x.r}">${RATE_NAMES[x.r]}</span></li>`).join("")}</ul>${nextReviewListHTML()}`
        : `<p class="muted">None of the key words are in review yet — schedules unchanged.</p>`}
      <div class="btnrow"><button class="btn" id="rdBackList">Stories</button>${nx && nx.id !== id ? `<button class="btn sec" id="rdNextStory">Next story ▶</button>` : ""}<button class="btn ghost" id="rdAgain">Read again</button></div></div>`;
    $("#sprog").style.width = "100%"; sfx.level(); if (right === qs.length) confetti(100);
    bindNextReview($("#qhost"));
    $("#rdBackList").onclick = () => go(readingHome);
    $("#rdAgain").onclick = () => go(() => rdStory(id, back));
    const ns = $("#rdNextStory"); if (ns) ns.onclick = () => go(() => rdStory(nx.id, readingHome));
  };
  const onKey = e => {
    if (document.querySelector(".modal")) return;
    if (!answered && /^[1-4]$/.test(e.key) && QZ.choose) QZ.choose(+e.key - 1);
    else if (answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const b = $("#nextBtn") || $("#rdBackList"); if (b) b.click(); }
  };
  addEventListener("keydown", onKey); cleanup = () => removeEventListener("keydown", onKey);
  show();
}
function rdStoryModal(st) {
  const md = document.createElement("div"); md.className = "modal"; md.id = "rdModal";

  document.body.appendChild(md);
  md.onclick = e => { if (e.target === md || e.target.id === "rdModalClose") md.remove(); };
}

const CF_PR = {

  "で|に": "に = destination, time, or where something exists (いる/ある); で = where an action happens, or the means (バスで, にほんごで).",
  "に|へ": "へ stresses direction (toward); に marks the destination — both work with いく/くる, but only に for times and existence.",
  "で|へ": "へ = direction of movement; で = place where the action takes place.",
  "が|を": "を marks the direct object of an action; が marks the subject — and the object of すき/きらい/じょうず/わかる/ほしい/できる.",
  "に|を": "を = what the action is done to (or the route: みちをあるく); に = target, recipient or destination (あう・のる・なる take に).",
  "と|や": "と lists everything (A and B, complete); や gives examples (A, B, and so on).",
  "から|まで": "から = from (starting point); まで = until / as far as (end point).",
  "は|も": "も means “too / also”; は sets the topic, often in contrast.",
  "か|ね": "か makes a question; ね asks for agreement (“…, right?”).",
  "ね|よ": "ね seeks agreement; よ tells the listener something new or emphasises.",
  "か|よ": "か makes a question; よ asserts information the listener may not know.",
  "と|に": "と = together with someone, or quoting; に = target, destination or time.",
  "で|を": "で = place of the action or the means; を = the object, or the space you move through (こうえんをさんぽする).",
  "の|は": "の links nouns (わたしのほん = my book); は marks the topic of the sentence.",
  "が|の": "の links two nouns (A の B); が marks the subject of a verb or adjective.",
  "に|は": "に marks time/place/target; は marks the topic (には = “as for at/to…”).",
  "で|と": "で = place or means; と = together with (ともだちと).",
  "から|に": "から = from / because; に = to / at."
